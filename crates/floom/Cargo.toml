# --- OHOS: the retargeted fork is a plain dependency, not a `[patch]` ---
# A `[patch.crates-io] tgui-winit-ohos = { path = ... }` entry used to live
# here. The fork is now package-renamed to `floom-winit-ohos`, and a `[patch]`
# entry must keep the name of the package it replaces, so it became a plain
# path dependency in `[workspace.dependencies]`. The retarget rationale
# (`winit_core -> floem_winit_core`, zero logic change) is recorded in the
# OHOS dependency block above.

# --- lapce/winit: pin every member of the vendor fork to the local tree ---
#
# Two reasons, and the second is a correctness fix:
#
# 1. iOS (#109). lapce/winit @ 133268de owns the `WinitApplicationDelegate` and
#    used to drop both cold-start (`application:didFinishLaunchingWithOptions:`)
#    and warm-start (`application:openURL:options:`) shares. This local fork
#    (built from the published `floem-winit 0.29.5`, which is that exact rev)
#    adds a `set_on_open_url` C callback that floom registers at startup; the
#    delegate forwards every shared `NSURL` through it. No drift risk — same
#    rev, same version (25.10.0). The fork's root `Cargo.toml` is a virtual
#    workspace, so the patch must point at member packages, not at the root.
#    See docs/ios.md "Step 8b".
#
# 2. OHOS trait identity. `crates/vendor/floom-winit-ohos` used to depend on the *git*
#    `floem-winit-core` / `dpi` while the patched `floem-winit` facade depends
#    on the vendored *path* copies. Cargo treats those as different packages, so
#    the resolve graph carried two `floem-winit-core` and three `dpi` instances
#    (`cargo metadata`). Floom's `Application` implements the local
#    `ApplicationHandler` while the OHOS backend required the git one — meaning
#    `export_ohos_winit_app!(floom_app_factory)` could not type-check. Every
#    member is now redirected to the vendored tree, so one instance is left.
#    This is only observable on an OHOS target, which is why macOS never
#    noticed.

