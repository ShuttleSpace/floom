# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Lore keeps dependency-veto + license compliance in `notices/`. Run with:
#   cargo install cargo-deny
#   cargo deny --config notices/deny.toml check
#
# The allow-lists below cover the licenses Floem and its direct dependencies use.
# Run `cargo deny check` once after install to surface any crate that needs a
# license exception added here.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Two `objc2` majors coexist on purpose: `accesskit_macos` pulls `objc2` 0.5,
# Floem's windowing keeps `objc2` 0.6 (see root Cargo.toml).
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/lapce/winit",
    "https://github.com/jrmoulton/understory",
]
