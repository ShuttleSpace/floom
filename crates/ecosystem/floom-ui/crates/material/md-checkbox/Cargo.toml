[package]
name = "floom-widget-md-checkbox"
license = "MIT"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 monolith (see ../floem-archive/docs/porting-floem-ui-to-2.0.md). The theme
# signal comes from floom-widget-runtime, which is already ported.
#
# `features = ["material"]`. All three design-system features are the *same* gate
# -- `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]`
# -- so enabling the wrong one compiles just as well. These are presence flags,
# not data selectors: nothing but reading the manifest catches a kit asking for
# the wrong one.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["material"] }
floom-signal = { path = "../../../../../core/floom-signal" }
# The engine's colour type, which floom-ui-composites' `CheckboxStyle` speaks.
floom-types = { path = "../../../../../core/floom-types" }
# The checkmark. `md-icon` was ported whole, so unlike the other two kits there
# is no `-icon-paths` crate here: the path data stayed inside it and comes out
# through `MdIcon::path_data`.
floom-widget-md-icon = { path = "../md-icon" }
# The engine's `Checkbox` lives a layer up, in the composite crate; this kit
# adapts its tokens to that rather than to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core = { path = "../../../../../core/floom-core" }
# The paint assertions read back a recorded scene, which needs the testkit the
# engine ships.
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
floom-types = { path = "../../../../../core/floom-types" }
floom-core-theme = { workspace = true }
