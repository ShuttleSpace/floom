[package]
name = "floem-material"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Material 3 design system tokens and control variants for Floem 2.0"
rust-version.workspace = true

[dependencies]
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
floem-style = { path = "../../layout/floem-style", version = "0.2.0" }
floem-theme = { path = "../../framework/floem-theme", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
floem-design = { path = "../floem-design", version = "0.2.0" }

[dev-dependencies]
# The golden-file engine (Phase 24.2). A test-only dependency: layering is a
# property of what a crate ships, and a design system ships no snapshot code.
floem-snapshot = { path = "../../tooling/floem-snapshot", version = "0.2.0" }
# The engine-side consumer of this design system's motion tokens (B6): a
# test-only upward edge that proves `MotionTransition` feeds `Button::transition`
# end-to-end. Dev-dependencies do not count against the architecture gate, which
# checks only what a crate ships.
floem-widgets = { path = "../../widgets/floem-widgets", version = "0.2.0" }
# Test-only still: it lets the test below run a real frame loop, which is the
# only way to show the token is not merely convertible but *played*.
floem-app = { path = "../../app/floem-app", version = "0.2.0" }
floem-layout = { path = "../../layout/floem-layout", version = "0.2.0" }
