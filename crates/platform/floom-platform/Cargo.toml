[package]
name = "floom-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform ABI for Floom 2.0 (OS-neutral contracts)"
rust-version.workspace = true

[dependencies]
floom-types = { workspace = true }
bitflags = "2.9"
# Handle descriptors only — no windowing or GPU library. See `src/surface.rs`.
raw-window-handle = { workspace = true }
# The `AccessibilityAdapter` door on the `Platform` trait. Core-layer crate:
# bitflags plus `floom-types`, so every backend can afford it unconditionally.
floom-accessibility = { workspace = true }

[features]
default = []
# OS-free stand-in backends folded in from the former `floom-platform-ios`,
# `floom-platform-embedded` and `floom-platform-harmony` crates. They exist so a
# dependent can name the backend it means; the accessibility schema they used to
# pull in is now unconditional (see the `Platform::accessibility` door).
ios = []
embedded = []
harmony = []

[dev-dependencies]
