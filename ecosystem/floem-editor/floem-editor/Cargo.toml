[package]
name = "floem-editor"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Floem text and code editor views"

[lib]
path = "src/lib.rs"

[dependencies]
floem.workspace = true
floem-legacy-reactive.workspace = true
floem-editor-core = { path = "../floem-editor-core" }
lapce-xi-rope = "0.4.0"
peniko = { version = "0.6.0", features = ["serde"] }
parley = "0.7.0"
ui-events = { version = "0.3", features = ["kurbo"] }
taffy = { version = "0.9.2", features = ["grid"] }
smallvec = "1.15"
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28" }
serde = { version = "1.0", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "floem-editor-core/serde"]
