[package]
name = "calculator"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# `native-activity` loads a *shared library* named by the manifest's
# `android.app.lib_name` meta-data (`floem_android_example`). A bin-only crate
# produces an executable and `cargo ndk` would copy nothing into `jniLibs/`,
# so the Android entry point must live in a `cdylib` lib target.
[lib]
name = "calculator"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
floem = { path = "../.." }

# On Android we need the *same* winit fork Floem uses so the `AndroidApp`
# type lines up with `floem::Application::new_android`. The rev must match the
# one pinned in Floem's `Cargo.toml` (`winit` workspace dependency).
[target.'cfg(target_os = "android")'.dependencies]
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit", features = ["android-native-activity"] }
# JNI types for the `onActivityResult` native bridge that delivers file-dialog
# results back to Floem (see `FloemNativeActivity.java`).
jni = "0.21"
