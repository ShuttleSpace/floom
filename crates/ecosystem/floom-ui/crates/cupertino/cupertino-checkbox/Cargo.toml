[package]
name = "floom-widget-cupertino-checkbox"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 monolith (see docs/porting-floem-ui-to-2.0.md). The theme
# binding is `RwSignal<MultiTheme>`, built here for `DesignSystem::Cupertino`
# rather than read from the app-wide signal -- the same choice `cupertino-radio`
# makes, and the opposite of Material's.
#
# `features = ["cupertino"]`. All three design-system features are the *same*
# gate -- `#[cfg(any(feature = "material", feature = "cupertino", feature =
# "fluent"))]` -- so enabling the wrong one compiles just as well, which is how a
# generated manifest once said `["material"]` in a Cupertino crate and still
# built. These features are presence flags, not data selectors.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["cupertino"] }
floom-signal = { path = "../../../../../floom-signal" }
# The engine's colour type, which floom-ui-composites' `CheckboxStyle` speaks.
floom-types = { path = "../../../../../floom-types" }
floom-core = { path = "../../../../../floom-core" }
floom-widgets = { path = "../../../../../floom-widgets" }
# The checkmark's path data. The v1 `cupertino-icon` crate cannot be depended on
# -- it is still v1 -- so the path comes from the crate that was split out of it.
floom-widget-cupertino-icon-paths = { path = "../cupertino-icon-paths" }
# The engine's `Checkbox` lives a layer up, in the composite crate; this kit
# adapts its tokens to that rather than to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core = { path = "../../../../../floom-core" }
# The paint assertions read back a recorded scene, which needs the testkit the
# engine ships.
floom-widgets = { path = "../../../../../floom-widgets" }
floom-types = { path = "../../../../../floom-types" }
floom-core-theme = { workspace = true }
