[package]
name = "floom-window-software"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Floom 2.0 in a real window with the software renderer — no GPU needed"

# The counterpart of `floom-window`: same window, no GPU. It goes through the
# public entries (`run_desktop_software_observed`, and `_watched` behind
# `--watch`) rather than a copy of the loop, so what CI runs is what an app runs.
# See `scripts/desktop-smoke.sh`.
[dependencies]
floom-app = { workspace = true }
# The agent protocol is the reason this example can be driven from a script as
# well as looked at.
floom-accuracy = { workspace = true }
floom-core = { workspace = true }
floom-layout = { workspace = true }
# The facade, with the two features that make a software window: what a user
# would write in their own `Cargo.toml`.
floom = { workspace = true, features = ["desktop", "renderer-software"] }
floom-renderer-software = { workspace = true }
floom-types = { workspace = true }
floom-widgets = { workspace = true }
# Only for `--watch`: the example owns the watcher, the library does not know what
# a source file is.
floom-hot-reload = { workspace = true }
