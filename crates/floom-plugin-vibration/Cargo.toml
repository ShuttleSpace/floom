[package]
name = "floom-plugin-vibration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: haptics and device vibration"
rust-version.workspace = true
publish = false

# A plugin owns a *capability* and the host owns the *transport*. It depends
# on the platform layer and on nothing above it: no widget stack, no renderer,
# no facade. An app that wants this capability adds this crate; an app that
# does not, does not link it.
[dependencies]

# The JNI bridge — the JavaVM, the activity — is platform
# plumbing, so it lives in the platform layer and a plugin reaches
# for it. A plugin reaching *down* to the platform is the allowed
# direction; the platform reaching up to a plugin is not.
floom-platform-mobile = { path = "../floom-platform-mobile", version = "0.2.0" }

# The iOS half reaches `UIKit` and `AudioToolbox` through objc2.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# The Android half reaches `Vibrator` through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
