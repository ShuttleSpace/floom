[package]
name = "floem2-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Self-drawn content: a line chart on a Canvas, clipped to its plot area"

# The software renderer is enabled *by the example*, not by the facade: the
# example's assertions render real pixels through it, and a facade consumer
# that never draws pays nothing for that.
[dependencies]
floem2 = { path = "../../app/floem2", version = "0.2.0", features = [
    "renderer-software",
] }
floem-renderer = { path = "../../render/floem-renderer", version = "0.2.0" }
