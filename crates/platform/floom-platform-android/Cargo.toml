[package]
name = "floom-platform-android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Android platform adapter for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-accessibility = { workspace = true }
floom-platform = { workspace = true }
floom-types = { workspace = true }
# The `logging` switch maps a property to a level on every target; only the
# logcat backend is Android-only.
log = "0.4"

# --- Android real backend (Phase 17 / 19.4) ---------------------------------
# These mirror the dependency blueprint already declared for the workspace root
# at `Cargo.toml` (the `android-native-activity` feature pulls in
# `floem-winit-android` + `android-activity`; `ndk` gives the native window for
# the renderer surface; `android_logger` routes logs to logcat). The block is
# target-gated so the host build (macOS) is untouched.
#
# No direct `jni` dependency: the platform hands its `JavaVM` / activity
# pointers to `crate::jni` (which owns the `jni` crate) and
# calls back through that module's `with_env`. Keeping the JNI types in one
# place also means one version of the crate in the graph.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
ndk = "0.9"
android_logger = "0.14"
jni = "0.22"

