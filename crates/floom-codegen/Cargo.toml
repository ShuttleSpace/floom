[package]
name = "floom-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed schema + native glue code generation for Floom 2.0 native components (Phase 18)"

[dependencies]
# L0 vocabulary: the runtime native-composition words (NativeViewKind,
# NativeCompositionMode, InputMode). The schema mirrors these as serializable
# copies and bridges with `From`; the codegen crate stays runtime-free.
floom-types = { path = "../floom-types", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
