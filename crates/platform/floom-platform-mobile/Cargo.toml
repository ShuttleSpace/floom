[package]
name = "floom-platform-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The mobile platform layer for Floom 2.0 (iOS/Android): the window-level facts and the JNI bridge, and nothing else."
rust-version.workspace = true

# The platform layer for mobile. It carries the **platform's** own work — the
# JNI bridge, the platform facts about a window — and not the capabilities: a
# capability is a plugin, in its own crate, opt-in by dependency.
#
# That is why this crate has no iOS dependency any more. The capabilities that
# needed `objc2` (the haptics) are plugins now, and a plugin brings its own
# framework bindings; the platform layer brings only what the platform itself
# needs.
[dependencies]
floom-types = { workspace = true }

# ── Android ────────────────────────────────────────────────────────────────
# The JNI bridge: the JavaVM, the activity, and the helpers the platform's
# own packages use. It is meaningful only on Android, and the `jni` crate is
# a target-gated dependency, so nothing pulls it on any other target.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
