[package]
name = "ohos"
version = "0.1.0"
edition = "2024"
publish = false

# The OHOS entry point is generated by `tgui_winit_ohos::export_ohos_winit_app!`,
# which lives in the retargeted fork (see floem/Cargo.toml `[patch.crates-io]`).
# The fork is resolved via the workspace patch, so `0.4` matches `0.4.11`.
#
# OHOS packages the Rust side as a `cdylib` (`libohos.so`) that the ArkTS Stage
# model loads through N-API. A `cdylib` has no `main` function — the C-ABI
# `ohos_winit_runtime_*` symbols produced by the macro *are* the entry point —
# which is why this crate is not a `bin`.
[lib]
crate-type = ["cdylib"]

[dependencies]
floem = { path = "../.." }

[target.'cfg(target_env = "ohos")'.dependencies]
tgui-winit-ohos = "0.4"
