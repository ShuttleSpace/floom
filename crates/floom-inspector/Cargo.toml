[package]
name = "floem-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned inspection protocol for Floem 2.0 devtools: tree/style/layout/scene/performance snapshots (Phase 23.1)"

[dependencies]
# Protocol-only crate: serde-friendly DTOs and validation rules. It never links
# the runtime, so a devtools frontend can parse a snapshot without a window.
# `floem-types` supplies only the `Color` <-> `Rgba` bridge.
floem-types = { path = "../floom-types", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
