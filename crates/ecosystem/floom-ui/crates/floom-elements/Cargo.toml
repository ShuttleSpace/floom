# `multi` enables ALL three Design Systems simultaneously and turns the neutral
# `floom-elements` facade into runtime-dispatched wrappers (they read the
# process-wide `design_system_signal` and delegate to the active DS concrete
# component). This is what lets the gallery switch DS live. It is mutually
# exclusive with the single-DS `material`/`cupertino`/`fluent` features.
# Runtime multi-DS mode.
#
# We enable `material` (so the 95 single-DS facade files resolve their
# `pub use ... as X` re-exports to the Material concrete widgets — exactly one
# definition, no duplicates) plus the concrete Cupertino/Fluent button/text/
# container crates that the runtime dispatch wrappers (`Button`/`Text`/
# `Container`) forward to. We deliberately do NOT enable the `cupertino`/
# `fluent` floom-elements features, because that would re-activate the three
# `pub use ... as X` re-exports in every facade file and cause duplicate-definition
# errors. The Cupertino/Fluent theme token data is still available because the
# `floom-core-theme/{cupertino,fluent}` features are on.
