[package]
name = "floom-plugin-background-work"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: ask the OS to bring this app back at a time"
rust-version.workspace = true
publish = false

# A capability plugin: one capability, one crate, opt-in by dependency. It
# depends on the platform layer and on nothing above it.
[dependencies]

# `AlarmManager` + `PendingIntent` are Java APIs, so the Android arm goes
# through the JNI bridge the platform layer owns. This is the one platform
# whose answer is a real arm rather than a refusal — see the crate doc for
# why that is the honest scope and not a bias.
[target.'cfg(target_os = "android")'.dependencies]
floom-platform-mobile = { path = "../../../floom-platform-mobile", version = "0.2.0" }
jni = "0.22"
