[package]
name = "floom-platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop platform adapter for Floom 2.0 (Winit lifecycle mapping)"
rust-version.workspace = true

[features]
default = []
# The real OS window + event loop. Off by default so the adapter (and the rest
# of the headless workspace build) stays free of winit unless an app asks for a
# window. `winit::raw_window_handle` is used for the surface handles, so no
# separate handle dependency is declared here.
winit = ["dep:winit", "dep:cursor-icon"]

[dependencies]
floom-accessibility = { workspace = true }
# Same layer (L4), so the architecture gate permits this edge: the desktop
# backend implements the native-view provider ABI, and `floom-native` stays a
# leaf that knows nothing about an OS.
floom-native = { workspace = true }
floom-platform = { workspace = true }
floom-types = { workspace = true }
winit = { workspace = true, optional = true }
# The fork's `window` module takes a `Cursor` but keeps `CursorIcon` private, so
# naming a pointer shape means naming this crate. Already in `Cargo.lock` as the
# fork's own dependency at one version, so this adds no download and Cargo
# unifies the two references to the same type.
cursor-icon = { version = "1.2.0", optional = true }

# The native-view host (Phase 16, task 16.2, step 7). AppKit is reached through
# `objc2`, at the versions the workspace already pins for the legacy crate and
# for `floem-winit-appkit` — no new major, no second runtime. Not inheritable
# from `[workspace.dependencies]`, which does not carry them; the versions here
# are the same numbers and the lock file keeps them aligned.
#
# `NSResponder` is here for the first-responder type in the focus path and
# `NSWindow` for `makeFirstResponder:` and the backing scale factor, so both are
# load-bearing rather than transitive.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    # The system clipboard (NSPasteboard) — see `src/clipboard.rs`.
    "NSPasteboard",
    "NSView",
    "NSResponder",
    "NSWindow",
    # Freezing a participant into a texture (Phase 16, task 16.4 step 3) needs
    # to read the view's rendered pixels back out of the window server. Both
    # features are required together: `bitmapImageRepForCachingDisplayInRect`
    # and `cacheDisplayInRect:toBitmapImageRep:` are gated on
    # `NSBitmapImageRep && NSImageRep`, and `pixelsWide`/`pixelsHigh` live on
    # `NSImageRep`.
    "NSBitmapImageRep",
    "NSImageRep",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    # `NSString` is how pasteboard text crosses the bridge.
    "NSString",
    "NSGeometry",
    "NSObject",
    # `NSArray::iter` — the native-view host walks a parent's subviews
    # through it. Without the feature the method is not compiled at all, so
    # the call is a compile error rather than a missing capability.
    "NSEnumerator",
] }

# The Win32 clipboard (Phase 20, S1.6). `windows-sys` is already in the lock at
# this version — the desktop plugins pin it for `ShellExecuteW`,
# `SetThreadExecutionState` and the file dialog — so this adds no download, and
# the feature list is the three modules the clipboard calls need.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
