[package]
name = "floom-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained element runtime primitives for Floom 2.0"
rust-version.workspace = true

[dependencies]
bitflags = "2.9"
smallvec = "1.15"
floom-types = { workspace = true }
floom-core = { workspace = true }
