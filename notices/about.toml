# cargo-about configuration — https://embarkstudios.github.io/cargo-about/
#
# Generates the THIRD-PARTY license notice from the resolved dependency graph.
# Run with:
#   cargo install cargo-about
#   cargo about generate --config notices/about.toml -o THIRD-PARTY.html
#
# Vendored / forked crates (under `vendor/`) have their licenses recorded in
# `manual-additions.toml` because they are not published to crates.io.

[invariants]
upload-urls = false

[licenses]
# Accept the licenses Floem and its dependencies use. Extend after the first
# `cargo about generate` surfaces an unlisted license.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
