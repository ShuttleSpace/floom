[package]
name = "floom-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tier-0 primitive widgets for Floom 2.0 (renderer- and OS-free)"
rust-version.workspace = true

[dependencies]
floom-core = { path = "../../core/floom-core", version = "0.2.0" }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
floom-text = { path = "../floom-text", version = "0.2.0" }
floom-accessibility = { path = "../../core/floom-accessibility", version = "0.2.0" }
floom-signal = { path = "../../core/floom-signal", version = "0.2.0" }
floom-animation = { path = "../../system/floom-animation", version = "0.2.0" }

[dev-dependencies]
floom-text = { path = "../floom-text", version = "0.2.0" }
floom-app = { path = "../../app/floom-app", version = "0.2.0" }
floom-layout = { path = "../../core/floom-layout", version = "0.2.0" }
