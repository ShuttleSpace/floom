[package]
name = "floom-plugin-nativeview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin whose capability is a native view, written in Objective-C"
rust-version.workspace = true
publish = false

# The plugin owns the *capability* and the host owns the *transport*: this
# crate depends on `floom-native-ffi` for the provider ABI and on
# `floom-platform` for the plugin registry, and on nothing else. It does not
# depend on the widget stack, the renderer or any OS framework — the native
# half is where AppKit lives.
[dependencies]
floom-native-ffi = { path = "../../../floom-native-ffi", version = "0.2.0" }
floom-platform = { path = "../../../floom-platform", version = "0.2.0" }

# Android-only: the JNI bridge to the Java half (FloomCameraView). Other
# targets do not link it — `src/android.rs` is `#[cfg(target_os = "android")]`
# and the `jni` dependency is gated the same way.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
floom-platform-mobile = { path = "../../../floom-platform-mobile" }

[build-dependencies]
cc = "1"

[dev-dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSView",
    "NSResponder",
    "NSWindow",
    "NSApplication",
    "NSRunningApplication",
    # `NSWindow`'s initialiser and `NSBackingStoreType` live behind the
    # graphics feature.
    "NSGraphics",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSRunLoop",
    "NSDate",
] }
