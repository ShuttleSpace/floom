[package]
name = "floom-widget-fluent-select"
version = "0.1.0"
edition = "2021"

[dependencies]
# The theme signal comes from floem-widget-runtime, which is already ported.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["fluent"] }
# The chevron's path data, which has no v1 dependency of its own.
floom-widget-fluent-icon-paths = { path = "../fluent-icon-paths" }
# The engine's  moved up a layer; this kit adapts its tokens to the
# composite, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }
floom-signal = { path = "../../../../../floom-signal" }
floom-core = { path = "../../../../../floom-core" }
floom-types = { path = "../../../../../floom-types" }
floom-widgets = { path = "../../../../../floom-widgets" }

[dev-dependencies]
floom-core-theme = { workspace = true }
floom-core = { path = "../../../../../floom-core" }
floom-types = { path = "../../../../../floom-types" }
floom-widgets = { path = "../../../../../floom-widgets" }
