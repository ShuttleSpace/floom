[package]
name = "floom-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless test harness that drives a Floom 2.0 app the way a window would"
rust-version.workspace = true

[dependencies]
floom-app = { workspace = true }
floom-core = { workspace = true }
floom-types = { workspace = true }
floom-layout = { workspace = true }
floom-scene = { workspace = true }
# A harness has to own the same two edges the app shell does: it delivers the
# platform ABI in and reads the scene out. That is the whole point of it, and it
# is why this crate sits *above* the app rather than beside the framework
# crates — nothing in the framework may depend on it.
floom-platform = { workspace = true }
floom-renderer-software = { workspace = true }

[dev-dependencies]
floom-widgets = { workspace = true }
