[package]
name = "floom-widget-cupertino-date_picker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md).
floom-core-theme = { workspace = true }
# The calendar is a host overlay: `OverlayHost` is the engine's bookkeeping for
# one, and it is shared by the three design systems.
floom-ui-composites = { path = "../../floom-ui-composites" }
floom-signal = { path = "../../../../../core/floom-signal" }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }

[dev-dependencies]
floom-core-theme = { workspace = true, features = ["cupertino"] }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
