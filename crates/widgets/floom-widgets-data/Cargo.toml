[package]
name = "floom-widgets-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tier-2 advanced data widgets for Floom 2.0 (virtualized grids, trees, charts, media)"
rust-version.workspace = true

[dependencies]
floom-core = { path = "../../core/floom-core", version = "0.2.0" }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
floom-accessibility = { path = "../../core/floom-accessibility", version = "0.2.0" }
floom-virtual = { path = "../floom-virtual", version = "0.2.0" }
floom-text = { path = "../floom-text", version = "0.2.0" }
# The Tier-1 crate: a data grid is built *out of* primitives (its labels are
# `Text`-shaped, its semantics vocabulary is the same `SemanticsHint`), and the
# accessibility bridge lives there rather than being copied per widget crate.
floom-widgets = { path = "../floom-widgets", version = "0.2.0" }

[dev-dependencies]
# The deterministic context recorders live in the Tier-1 crate's `testkit`;
# a data widget's tests are ordinary widget tests, so they reuse it rather than
# growing a second copy of the same recorders.
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "virtual_rows"
harness = false
