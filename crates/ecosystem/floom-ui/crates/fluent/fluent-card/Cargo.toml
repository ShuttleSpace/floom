[package]
name = "floom-widget-fluent-card"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see ../floem-archive/docs/porting-floem-ui-to-2.0.md).
# The theme signal comes from floom-widget-runtime, which is already ported.
#
# `features = ["fluent"]`, not `["material"]`. This manifest started as a copy of
# md-card's with the name changed, and the feature came along for the ride. It
# compiled anyway, because all three design-system features are the *same* gate --
# `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]` --
# so enabling the wrong one satisfies it exactly as well. See the correction in
# ../floem-archive/docs/porting-floem-ui-to-2.0.md: a Fluent crate asking for Material is wrong on
# its face and will break the day those features become real selectors.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["fluent"] }
floom-signal = { path = "../../../../../core/floom-signal" }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }

[dev-dependencies]
floom-core-theme = { workspace = true }
floom-types = { path = "../../../../../core/floom-types" }
