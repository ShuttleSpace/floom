[package]
name = "floom-dsl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative UI DSL: parser, lowering to the UI IR, and builder codegen"

[dependencies]
# The IR owns the vocabulary (kinds, properties, events, bindings). This crate
# deliberately does not restate it: it lowers into the IR and then asks the IR
# to validate, so there is exactly one property table in the workspace.
floom-ui-ir = { path = "../floom-ui-ir", version = "0.2.0" }

[dev-dependencies]
