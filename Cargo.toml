[workspace.package]
license = "MIT"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/lapce/floom"

[workspace.dependencies]
peniko = { version = "0.6.0", features = ["serde"] }
parley = { version = "0.7.0" }
fontique = { version = "0.7.0" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
lapce-xi-rope = "0.4.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28" }
# Image format features are defined via new features
image = { version = "0.25", default-features = false }
imbl = "7.0"
resvg = { version = "0.46" }
raw-window-handle = "0.6.0"
unicode-segmentation = "1.10"
wgpu = { version = "27.0" }
parking_lot = { version = "0.12" }
swash = { version = "0.2" }
muda = { version = "0.17.1", default-features = false }
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit" }
ui-events = { version = "0.3", features = ["kurbo"] }
floom-ui-events-winit = { path = "./crates/floom-ui-events-winit", package = "floom-ui-events-winit" }
# OHOS event loop / windowing. A vendored fork of `tgui-winit-ohos` — see
# crates/vendor/README.md. Declared as a plain path dependency rather than a
# `[patch]`, because the fork is package-renamed and a `[patch]` entry must
# keep the name of the package it replaces.
floom-winit-ohos = { path = "crates/vendor/floom-winit-ohos" }
dpi = { version = "0.1.2", default-features = false }
rustc-hash = "2.1"

[patch."https://github.com/lapce/winit"]
floem-winit = { path = "crates/vendor/floem-winit/winit" }
floem-winit-core = { path = "crates/vendor/floem-winit/winit-core" }
dpi = { path = "crates/vendor/floem-winit/dpi" }
