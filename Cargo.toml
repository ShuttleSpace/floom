[workspace]
resolver = "3"
# `crates/vendor/` holds forked upstream trees wired in via `[patch]` / path deps.
# `crates/ecosystem/` holds the satellite projects (floom-editor, floem-ui);
# each is its own workspace, so the root `cargo test --workspace` stays focused
# on the core. Build them from their own directory.
exclude = ["crates/vendor", "crates/ecosystem"]
members = [
  "crates/floom-accessibility",
  "crates/floom-accuracy",
  "crates/floom-agent",
