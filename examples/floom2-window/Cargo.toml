[package]
name = "floom2-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Floom 2.0 counter in a real OS window (winit + vello GPU), feature-gated"

# The real-window stack pulls in winit and wgpu. Everything is optional so the
# default workspace build (and CI) stays dependency-light; `--features real`
# activates the full desktop stack.
[features]
default = []
real = [
    "dep:floom-platform-desktop",
    "dep:floom-renderer-vello",
    "dep:image",
    "floom-platform-desktop/winit",
    "floom-renderer-vello/gpu",
]

[dependencies]
floom-app = { path = "../../crates/floom-app", version = "0.2.0" }
floom-core = { path = "../../crates/floom-core", version = "0.2.0" }
floom-layout = { path = "../../crates/floom-layout", version = "0.2.0" }
# The entry fade-in is the only motion here, and it is finite on purpose (see
# `WindowApp::intro_fade`): an animation that never ends would make this
# binary's own idle harness (device case G1-4) unable to park.
floom-animation = { path = "../../crates/floom-animation", version = "0.2.0" }
floom-platform = { path = "../../crates/floom-platform", version = "0.2.0" }
floom-types = { path = "../../crates/floom-types", version = "0.2.0" }
floom-widgets = { path = "../../crates/floom-widgets", version = "0.2.0" }
floom-platform-desktop = { path = "../../crates/floom-platform-desktop", version = "0.2.0", optional = true }
floom-renderer-vello = { path = "../../crates/floom-renderer-vello", version = "0.2.0", optional = true }
# PNG encode for the self-generated gradient (decode happens in floom-app).
image = { workspace = true, features = ["png"], optional = true }
# getrusage for the idle-probe CPU measurement (unix targets only; the probe
# needs the process's own CPU time, which std does not expose).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "floom2-window"
path = "src/main.rs"
required-features = ["real"]
