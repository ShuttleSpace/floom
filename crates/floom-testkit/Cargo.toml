[package]
name = "floom-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless test harness that drives a Floom 2.0 app the way a window would"
rust-version.workspace = true

[dependencies]
floom-app = { path = "../floom-app", version = "0.2.0" }
floom-core = { path = "../floom-core", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }
floom-layout = { path = "../floom-layout", version = "0.2.0" }
floom-scene = { path = "../floom-scene", version = "0.2.0" }
# A harness has to own the same two edges the app shell does: it delivers the
# platform ABI in and reads the scene out. That is the whole point of it, and it
# is why this crate sits *above* the app rather than beside the framework
# crates — nothing in the framework may depend on it.
floom-platform = { path = "../floom-platform", version = "0.2.0" }
floom-renderer-software = { path = "../floom-renderer-software", version = "0.2.0" }

[dev-dependencies]
floom-widgets = { path = "../floom-widgets", version = "0.2.0" }
