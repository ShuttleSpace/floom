[package]
name = "floom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Floom 2.0 public facade: the beginner-facing prelude and feature bundles"

# Phase 29.3 — feature bundles.
#
# The default build is the headless core: no windowing backend, no GPU
# renderer, no tooling. Bundles are the beginner-facing spelling of "what a
# real app needs"; each one only adds `optional = true` dependencies, so
# `unused backends are not linked` is enforced structurally (and tested by
# `tests/feature_graph.rs`).
#
# Platform bundles: desktop / mobile / web / embedded. Only `desktop` is
# buildable on this machine (macOS + winit); the others exist so a
# target-appropriate build is one `--features` away.
#
# Capability bundles: `renderer-gpu` (vello + wgpu), `renderer-software`
# (tiny-skia), `devtools` (the L8 inspector/devtools tier — reachable from the
# facade because the facade sits at L9, above the tooling it re-exports).
#
# `native` needs no bundle: native view composition is part of the `floom-app`
# shell itself (Phase 16), not an optional backend.
[features]
default = []
desktop = ["dep:floom-platform-desktop", "floom-platform-desktop/winit"]
mobile = [
    "dep:floom-platform-android",
    "floom-platform/ios",
    "floom-platform/harmony",
]
web = ["dep:floom-platform-web", "dep:floom-renderer-web"]
embedded = [
    "dep:floom-platform-embedded",
    "dep:floom-renderer-software",
    "floom-platform/embedded",
]
# iOS and HarmonyOS are full OS backends, not the embedded board. Each is a
# N-API/UIKit native-surface sibling crate plus the software renderer that
# produces its frames; the OS owns window/lifecycle/input. They are their own
# bundles so an `embedded` build never drags them in and vice versa.
ios = ["dep:floom-platform-ios", "dep:floom-renderer-software"]
harmony = ["dep:floom-platform-harmony", "dep:floom-renderer-software"]
# Terminal (character-grid) backend: the L4 platform + renderer that turn a
# terminal into a live Floom window. Off by default so a default build stays
# headless; `--features tui` adds exactly these two crates.
tui = ["dep:floom-platform-tui", "dep:floom-renderer-tui"]
renderer-gpu = ["dep:floom-renderer-vello", "floom-renderer-vello/gpu"]
renderer-software = ["dep:floom-renderer-software"]
devtools = ["dep:floom-devtools", "dep:floom-hot-reload"]
# The three L8 tooling crates that reach the software renderer. They cannot be
# default facade deps: `tests/feature_graph.rs` asserts the default build links
# no renderer backend. `full` is the opt-in that hangs *every* workspace crate
# off the facade; `--all-features` includes it.
full = [
    "dep:floom-accuracy",
    "dep:floom-snapshot",
    "dep:floom-testkit",
    "dep:floom-ui-events-winit",
]

[dependencies]
floom-app = { workspace = true }
floom-core = { workspace = true }
# Only the motion *vocabulary* is taken from here (the kind space and the
# tween builder); the scheduler itself stays behind `floom-app`. It is a new
# edge for the facade but not a new crate in the graph — `floom-app` already
# depends on it, so the headless floor `floom-hello` measures is unchanged.
floom-animation = { workspace = true }
floom-layout = { workspace = true }
# The reactive surface (`floom::reactive`): signals, scopes and their traits.
# A facade edge but no new crate in the graph — `floom-widgets` and
# `floom-runtime-core` already depend on it.
floom-signal = { workspace = true }
# Re-exported whole (`floom::floom_scene`): the retained scene is the IR an
# app inspects when it asserts on what it drew, and `floom-app` already
# depends on it, so the headless graph gains no new crate.
floom-scene = { workspace = true }
floom-types = { workspace = true }
# The neutral L4 contract (`Platform`, `WindowConfig`, `PlatformEvent`). The
# facade needs `WindowConfig` to describe a window for whichever backend the
# `run_*` entries drive, so this is a plain dependency, not a per-backend one.
floom-platform = { workspace = true }
floom-widgets = { workspace = true }
floom-platform-desktop = { workspace = true, optional = true }
floom-platform-android = { workspace = true, optional = true }
floom-platform-web = { workspace = true, optional = true }
floom-renderer-web = { workspace = true, optional = true }
floom-platform-tui = { workspace = true, optional = true }
floom-renderer-tui = { workspace = true, optional = true }
floom-platform-embedded = { workspace = true, optional = true }
floom-platform-ios = { workspace = true, optional = true }
floom-platform-harmony = { workspace = true, optional = true }
floom-renderer-vello = { workspace = true, optional = true }
floom-renderer-software = { workspace = true, optional = true }
floom-devtools = { workspace = true, optional = true }
# `floom::devtools::attach_elements` describes the host's own nodes into
# a live tree, which is what the inspector reads. Optional with the
# devtools bundle, which is the only feature that needs it.
floom-hot-reload = { workspace = true, optional = true }

# Every remaining root-workspace library crate, re-exported under a short name
# (`floom::accessibility`, `floom::style`, …). These do not reach a renderer or
# windowing backend, so they are safe as default deps; the three that do are
# gated behind `full` above. `floom-cli` is a binary-only crate with no [lib],
# so it cannot be re-exported and is deliberately absent.
floom-accessibility = { workspace = true }
floom-dsl = { workspace = true }
floom-editor = { workspace = true }
floom-editor-core = { workspace = true }
floom-inspector = { workspace = true }
floom-native = { workspace = true }
floom-native-ffi = { workspace = true }
floom-platform-mobile = { workspace = true }
floom-renderer = { workspace = true }
floom-runtime-core = { workspace = true }
floom-style = { workspace = true }
floom-text = { workspace = true }
floom-tsx = { workspace = true }
floom-virtual = { workspace = true }
floom-widgets-data = { workspace = true }

floom-accuracy = { workspace = true, optional = true }
floom-snapshot = { workspace = true, optional = true }
floom-testkit = { workspace = true, optional = true }
floom-ui-events-winit = { workspace = true, optional = true }
