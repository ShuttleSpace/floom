[package]
name = "floom-forms-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Form validation golden example: rules, dirty/touched tracking and control bindings"

[dependencies]
floom = { path = "../../crates/floom", version = "0.2.0" }
# `TextField` is no longer in `~F~::prelude` -- it moved to the satellite
# `~F~-ui` workspace -- so the demo names the engine's other text widget.
floom-widgets = { path = "../../crates/floom-widgets", version = "0.2.0" }
floom-forms = { path = "../../crates/floom-forms", version = "0.2.0" }
