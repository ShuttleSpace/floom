[package]
name = "widget-gallery"
version = "0.1.0"
edition = "2024"

[dependencies]
floom = { path = "../../crates/floom", features = ["skia"] }
floom-editor = { path = "../../crates/ecosystem/floom-editor/floom-editor" }
strum = { workspace = true }
files = { path = "../files", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
signpost = "*"

[features]
default = ["full"]
vello = ["floom/vello"]
full = ["dep:files"]
