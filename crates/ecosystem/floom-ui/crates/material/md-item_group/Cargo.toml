[package]
name = "floom-widget-md-item_group"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md).
# The theme signal comes from floom-widget-runtime, which is already ported.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["material"] }
floom-signal = { path = "../../../../../floom-signal" }
floom-core = { path = "../../../../../floom-core" }
floom-types = { path = "../../../../../floom-types" }
floom-widgets = { path = "../../../../../floom-widgets" }
# The engine's SelectGroup moved up a layer with the composites; the kit adapts its
# tokens to that, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core-theme = { workspace = true }
floom-core = { path = "../../../../../floom-core" }
floom-types = { path = "../../../../../floom-types" }
floom-widgets = { path = "../../../../../floom-widgets" }
# The engine's SelectGroup moved up a layer with the composites; the kit adapts its
# tokens to that, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }
