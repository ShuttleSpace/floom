[package]
name = "floem-renderer-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web/WASM canvas presenter for Floem 2.0 (CPU scene rasterizer + canvas blit)"

[dependencies]
floem-renderer = { path = "../floem-renderer", version = "0.2.0" }
floem-renderer-software = { path = "../floem-renderer-software", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
] }
