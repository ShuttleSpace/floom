[package]
name = "floem2-shader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Custom WGSL shaders: a box whose ink is a program, and the degradation a CPU rasteriser records"

# The software renderer is enabled *by the example*, not by the facade: act 2
# renders the same scene a GPU backend would and reads what the CPU rasteriser
# did with it — the skip has to be counted, not silent.
[dependencies]
floem2 = { path = "../../app/floem2", version = "0.2.0", features = [
    "renderer-software",
] }
floem-renderer = { path = "../../render/floem-renderer", version = "0.2.0" }
