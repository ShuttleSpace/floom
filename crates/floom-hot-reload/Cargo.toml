[package]
name = "floom-hot-reload"
description = "Hot-reload of widget, style and IR changes for Floom 2.0 applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floom-types = { path = "../floom-types", version = "0.2.0" }
floom-core = { path = "../floom-core", version = "0.2.0" }
floom-style = { path = "../floom-style", version = "0.2.0" }
floom-runtime-core = { path = "../floom-runtime-core", version = "0.2.0" }
floom-ui-ir = { path = "../floom-ui-ir", version = "0.2.0" }

[dev-dependencies]
# Test documents read better as DSL source than as struct literals.
floom-dsl = { path = "../floom-dsl", version = "0.2.0" }
