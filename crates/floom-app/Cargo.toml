[package]
name = "floem-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless app shell that hosts a Floem 2.0 widget tree"
rust-version.workspace = true

[dependencies]
floem-core = { path = "../floom-core", version = "0.2.0" }
floem-types = { path = "../floom-types", version = "0.2.0" }
floem-scene = { path = "../floom-scene", version = "0.2.0" }
floem-accessibility = { path = "../floom-accessibility", version = "0.2.0" }
floem-layout = { path = "../floom-layout", version = "0.2.0" }
floem-runtime-core = { path = "../floom-runtime-core", version = "0.2.0" }
floem-runtime = { path = "../floom-runtime", version = "0.2.0" }
floem-focus = { path = "../floom-focus", version = "0.2.0" }
floem-overlay = { path = "../floom-overlay", version = "0.2.0" }
# The same scheduler the overlay stack drives its entry animation with: a
# frozen participant is animated by reusing it, not by adding a second clock.
floem-animation = { path = "../floom-animation", version = "0.2.0" }
floem-services = { path = "../floom-services", version = "0.2.0" }
floem-error = { path = "../floom-error", version = "0.2.0" }
floem-widgets = { path = "../floom-widgets", version = "0.2.0" }
floem-text = { path = "../floom-text", version = "0.2.0" }
# Participant ABI: the app hosts native views, so it is where the controller
# lives. The OS bridges themselves stay in the platform crates.
floem-native = { path = "../floom-native", version = "0.2.0" }
# The wiring layer: the app is the top of the layering, so it is the one crate
# allowed to name both the platform ABI and the renderer ABI.
floem-platform = { path = "../floom-platform", version = "0.2.0" }
floem-renderer = { path = "../floom-renderer", version = "0.2.0" }
# Image decoding for `register_image_decoded`: PNG + JPEG decode the formats
# UI layers actually load; more formats can be opted into via features.
image = { workspace = true, features = ["png", "jpeg"] }
smallvec = "1.15"

[dev-dependencies]
floem-legacy-reactive = { path = "../floom-legacy-reactive", version = "0.2.0" }
floem-forms = { path = "../floom-forms", version = "0.2.0" }
floem-renderer-software = { path = "../floom-renderer-software", version = "0.2.0" }
floem-renderer-tui = { path = "../floom-renderer-tui", version = "0.2.0" }
floem-platform-tui = { path = "../floom-platform-tui", version = "0.2.0" }
floem-text = { path = "../floom-text", version = "0.2.0" }
# The integration suites drive the app through the shared harness rather than
# each growing their own copy of it.
floem-testkit = { path = "../floom-testkit", version = "0.2.0" }
