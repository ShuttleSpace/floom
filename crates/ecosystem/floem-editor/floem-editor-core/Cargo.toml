[package]
name = "floem-editor-core"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "The core of the floem text editor"

[dependencies]
serde = { version = "1.0", optional = true }
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28" }
ui-events = { version = "0.3", features = ["kurbo"] }
lapce-xi-rope = "0.4.0"
itertools = "0.14.0"
bitflags = "2.4.2"
memchr = "2.7.1"

[features]
serde = ["dep:serde"]
