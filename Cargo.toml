[workspace]
members = [
    "crates/floem-core-theme",
    "crates/floem-widget-runtime",
    "crates/floem-elements",
    "crates/material/md-button",
    "crates/material/md-text",
    "crates/material/md-text-field",
    "crates/material/md-checkbox",
    "crates/material/md-switch",
    "crates/material/md-dialog",
    "crates/material/md-menu",
    "crates/material/md-card",
    "crates/material/md-icon",
    "crates/material/md-divider",
    "crates/cupertino/cupertino-button",
    "crates/cupertino/cupertino-text",
    "crates/cupertino/cupertino-text-field",
    "crates/cupertino/cupertino-checkbox",
    "crates/cupertino/cupertino-switch",
    "crates/cupertino/cupertino-dialog",
    "crates/cupertino/cupertino-menu",
    "crates/cupertino/cupertino-card",
    "crates/cupertino/cupertino-icon",
    "crates/cupertino/cupertino-divider",
    "crates/fluent/fluent-button",
    "crates/fluent/fluent-text",
    "crates/fluent/fluent-text-field",
    "crates/fluent/fluent-checkbox",
    "crates/fluent/fluent-switch",
    "crates/fluent/fluent-dialog",
    "crates/fluent/fluent-menu",
    "crates/fluent/fluent-card",
    "crates/fluent/fluent-icon",
    "crates/fluent/fluent-divider",
    "crates/floem-testing",
    "examples/demo",
]

resolver = "2"

[workspace.dependencies]
floem = { git = "https://github.com/lapce/floem" }
floem-core-theme = { path = "crates/floem-core-theme" }
floem-widget-runtime = { path = "crates/floem-widget-runtime" }
floem-elements = { path = "crates/floem-elements" }
