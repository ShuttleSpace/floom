[package]
name = "floom-renderer-software"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Software/CPU Scene renderer adapter for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-renderer = { path = "../floom-renderer", version = "0.2.0" }
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
floom-text = { path = "../../widgets/floom-text", version = "0.2.0" }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
# CPU glyph rasterisation for the software text path (same engine vger and
# tiny-skia use on their cache misses).
swash.workspace = true
peniko.workspace = true

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "self_draw"
harness = false
