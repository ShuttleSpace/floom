[package]
name = "floom-material"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Material 3 design system tokens and control variants for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-types = { path = "../../../../core/floom-types", version = "0.2.0" }
floom-style = { path = "../../../../core/floom-style", version = "0.2.0" }
floom-theme = { path = "../floom-theme", version = "0.2.0" }
floom-scene = { path = "../../../../core/floom-scene", version = "0.2.0" }
floom-design = { path = "../floom-design", version = "0.2.0" }

[dev-dependencies]
# The golden-file engine (Phase 24.2). A test-only dependency: layering is a
# property of what a crate ships, and a design system ships no snapshot code.
floom-snapshot = { path = "../../../../devtools/floom-snapshot", version = "0.2.0" }
# The engine-side consumer of this design system's motion tokens (B6): a
# test-only upward edge that proves `MotionTransition` feeds `Button::transition`
# end-to-end. Dev-dependencies do not count against the architecture gate, which
# checks only what a crate ships.
floom-widgets = { path = "../../../../widgets/floom-widgets", version = "0.2.0" }
# Test-only still: it lets the test below run a real frame loop, which is the
# only way to show the token is not merely convertible but *played*.
floom-app = { path = "../../../../app/floom-app", version = "0.2.0" }
floom-layout = { path = "../../../../core/floom-layout", version = "0.2.0" }
