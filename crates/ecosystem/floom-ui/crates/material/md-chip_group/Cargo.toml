[package]
name = "floom-widget-md-chip_group"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md).
floom-widget-runtime = { workspace = true, features = ["material"] }
floom-core-theme = { workspace = true }
floom-signal = { path = "../../../../../core/floom-signal" }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
# The engine's SelectGroup moved up a layer with the composites; the kit adapts
# its tokens to that, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core-theme = { workspace = true, features = ["material"] }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
floom-ui-composites = { path = "../../floom-ui-composites" }
