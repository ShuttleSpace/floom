[workspace]
resolver = "3"
# `crates/vendor/` holds forked upstream trees wired in via `[patch]` / path deps.
# `crates/ecosystem/` holds the satellite projects (floom-editor, floem-ui,
# plugins); each is its own workspace, so the root `cargo test --workspace`
# stays focused on the core. Build them from their own directory, or by path
# from an application — `plugins/` is where every capability plugin lives.
exclude = [
  "crates/vendor",
  "crates/ecosystem",
  # A TSX-only app: it has no `Cargo.toml` on purpose (`floom run app.tsx`
  # generates one), so the workspace cannot own it.
  "examples/floom-tsx-app",
  # Generated plugin scaffolds carry their own `[workspace]`; the `floom-*`
  # glob below would otherwise pull one in and resolve its (relative, wrong)
  # platform path against `examples/`, breaking the whole workspace.
  "examples/floom-plugin-demo",
]
members = [
  "crates/core/floom-accessibility",
  "crates/system/floom-accuracy",
  "crates/system/floom-animation",
  "crates/app/floom-app",
  "crates/app/floom-cli",
  "crates/core/floom-core",
  "crates/devtools/floom-devtools",
  "crates/frontend/floom-dsl",
  "crates/widgets/floom-editor",
  "crates/widgets/floom-editor-core",    "crates/devtools/floom-hot-reload",
  "crates/devtools/floom-inspector",
  "crates/core/floom-layout",
  "crates/core/floom-signal",
  "crates/native/floom-native",
  "crates/native/floom-native-ffi",
        "crates/platform/floom-platform",
  "crates/platform/floom-platform-android",
  "crates/platform/floom-platform-desktop",
  "crates/platform/floom-platform-embedded",
  "crates/platform/floom-platform-mobile",
  "crates/platform/floom-platform-ios",
  "crates/platform/floom-platform-harmony",
  "crates/platform/floom-platform-tui",
  "crates/platform/floom-platform-web",
  "crates/render/floom-renderer",
  "crates/render/floom-renderer-software",
  "crates/render/floom-renderer-tui",
  "crates/render/floom-renderer-vello",
  "crates/render/floom-renderer-web",
  "crates/core/floom-runtime-core",
  "crates/core/floom-scene",
  "crates/devtools/floom-snapshot",
  "crates/core/floom-style",
  "crates/devtools/floom-testkit",
  "crates/widgets/floom-text",
  "crates/core/floom-types",
  "crates/platform/floom-ui-events-winit",
  "crates/frontend/floom-tsx",
  "crates/widgets/floom-virtual",
  "crates/widgets/floom-widgets",
  "crates/widgets/floom-widgets-data",
  "crates/app/floom",
  # Only the floom-* examples are crates. A bare `examples/*` made any stray
  # non-crate directory (xcodeproj leftovers, scratch folders) break the whole
  # workspace by being treated as a member with no Cargo.toml.
  "examples/floom-*",
]
default-members = [
  ".",
  "crates/core/floom-accessibility",
  "crates/system/floom-accuracy",
  "crates/system/floom-animation",
  "crates/app/floom-app",
  "crates/core/floom-core",
  "crates/devtools/floom-devtools",
  "crates/frontend/floom-dsl",
  "crates/widgets/floom-editor",
  "crates/widgets/floom-editor-core",    "crates/devtools/floom-hot-reload",
  "crates/devtools/floom-inspector",
  "crates/core/floom-layout",
  "crates/core/floom-signal",
  "crates/native/floom-native",
  "crates/native/floom-native-ffi",
        "crates/platform/floom-platform",
  "crates/platform/floom-platform-android",
  "crates/platform/floom-platform-desktop",
  "crates/platform/floom-platform-embedded",
  "crates/platform/floom-platform-mobile",
  "crates/platform/floom-platform-ios",
  "crates/platform/floom-platform-harmony",
  "crates/platform/floom-platform-tui",
  "crates/platform/floom-platform-web",
  "crates/render/floom-renderer",
  "crates/render/floom-renderer-software",
  "crates/render/floom-renderer-tui",
  "crates/render/floom-renderer-vello",
  "crates/render/floom-renderer-web",
  "crates/core/floom-runtime-core",
  "crates/core/floom-scene",
  "crates/devtools/floom-snapshot",
  "crates/core/floom-style",
  "crates/devtools/floom-testkit",
  "crates/widgets/floom-text",
  "crates/core/floom-types",
  "crates/platform/floom-ui-events-winit",
  "crates/frontend/floom-tsx",
  "crates/widgets/floom-virtual",
  "crates/widgets/floom-widgets",
  "crates/widgets/floom-widgets-data",
]

[workspace.package]
license = "MIT"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
repository = "https://gitee.com/floem/floem"

[workspace.dependencies]
floom = { path = "crates/app/floom", version = "0.2.0" }
floom-accessibility = { path = "crates/core/floom-accessibility", version = "0.2.0" }
floom-animation = { path = "crates/system/floom-animation", version = "0.2.0" }
floom-app = { path = "crates/app/floom-app", version = "0.2.0" }
floom-core = { path = "crates/core/floom-core", version = "0.2.0" }
floom-core-theme = { path = "crates/ecosystem/floom-ui/crates/floom-core-theme" }
floom-cupertino = { path = "crates/ecosystem/floom-ui/crates/floom-cupertino", version = "0.2.0" }
floom-devtools = { path = "crates/devtools/floom-devtools", version = "0.2.0" }
floom-dsl = { path = "crates/frontend/floom-dsl", version = "0.2.0" }
floom-editor = { path = "crates/widgets/floom-editor", version = "0.2.0" }
floom-fluent = { path = "crates/ecosystem/floom-ui/crates/floom-fluent", version = "0.2.0" }
floom-hot-reload = { path = "crates/devtools/floom-hot-reload", version = "0.2.0" }
floom-inspector = { path = "crates/devtools/floom-inspector", version = "0.2.0" }
floom-layout = { path = "crates/core/floom-layout", version = "0.2.0" }
floom-material = { path = "crates/ecosystem/floom-ui/crates/floom-material", version = "0.2.0" }
floom-native = { path = "crates/native/floom-native", version = "0.2.0" }
floom-platform = { path = "crates/platform/floom-platform", version = "0.2.0" }
floom-platform-android = { path = "crates/platform/floom-platform-android", version = "0.2.0" }
floom-platform-desktop = { path = "crates/platform/floom-platform-desktop", version = "0.2.0" }
floom-platform-embedded = { path = "crates/platform/floom-platform-embedded", version = "0.2.0" }
floom-platform-harmony = { path = "crates/platform/floom-platform-harmony", version = "0.2.0" }
floom-platform-ios = { path = "crates/platform/floom-platform-ios", version = "0.2.0" }
floom-platform-mobile = { path = "crates/platform/floom-platform-mobile", version = "0.2.0" }
floom-platform-tui = { path = "crates/platform/floom-platform-tui", version = "0.2.0" }
floom-platform-web = { path = "crates/platform/floom-platform-web", version = "0.2.0" }
floom-renderer = { path = "crates/render/floom-renderer", version = "0.2.0" }
floom-renderer-software = { path = "crates/render/floom-renderer-software", version = "0.2.0" }
floom-renderer-tui = { path = "crates/render/floom-renderer-tui", version = "0.2.0" }
floom-renderer-vello = { path = "crates/render/floom-renderer-vello", version = "0.2.0" }
floom-renderer-web = { path = "crates/render/floom-renderer-web", version = "0.2.0" }
floom-runtime-core = { path = "crates/core/floom-runtime-core", version = "0.2.0" }
floom-scene = { path = "crates/core/floom-scene", version = "0.2.0" }
floom-signal = { path = "crates/core/floom-signal", version = "0.2.0" }
floom-snapshot = { path = "crates/devtools/floom-snapshot", version = "0.2.0" }
floom-style = { path = "crates/core/floom-style", version = "0.2.0" }
floom-testkit = { path = "crates/devtools/floom-testkit", version = "0.2.0" }
floom-text = { path = "crates/widgets/floom-text", version = "0.2.0" }
floom-tsx = { path = "crates/frontend/floom-tsx" }
floom-types = { path = "crates/core/floom-types", version = "0.2.0" }
floom-ui-composites = { path = "crates/ecosystem/floom-ui/crates/floom-ui-composites" }
floom-virtual = { path = "crates/widgets/floom-virtual", version = "0.2.0" }
floom-widgets = { path = "crates/widgets/floom-widgets", version = "0.2.0" }
peniko = { version = "0.6.0", features = ["serde"] }
parley = { version = "0.7.0" }
fontique = { version = "0.7.0" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
lapce-xi-rope = "0.4.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28" }
# Image format features are defined via new features
image = { version = "0.25", default-features = false }
imbl = "7.0"
resvg = { version = "0.46" }
raw-window-handle = "0.6.0"
unicode-segmentation = "1.10"
wgpu = { version = "27.0" }
parking_lot = { version = "0.12" }
swash = { version = "0.2" }
muda = { version = "0.17.1", default-features = false }
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit" }
ui-events = { version = "0.3", features = ["kurbo"] }
floom-ui-events-winit = { path = "crates/platform/floom-ui-events-winit", package = "floom-ui-events-winit" }
# OHOS event loop / windowing. A vendored fork of `tgui-winit-ohos` — see
# crates/vendor/README.md. Declared as a plain path dependency rather than a
# `[patch]`, because the fork is package-renamed and a `[patch]` entry must
# keep the name of the package it replaces.
floom-winit-ohos = { path = "crates/vendor/floom-winit-ohos" }
dpi = { version = "0.1.2", default-features = false }
rustc-hash = "2.1"

[patch."https://github.com/lapce/winit"]
floem-winit = { path = "crates/vendor/floem-winit/winit" }
floem-winit-core = { path = "crates/vendor/floem-winit/winit-core" }
dpi = { path = "crates/vendor/floem-winit/dpi" }
