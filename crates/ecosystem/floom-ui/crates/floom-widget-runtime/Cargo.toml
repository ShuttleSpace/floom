[package]
name = "floom-widget-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith: theme state is an `RwSignal`, which the
# 2.0 prelude already re-exports from `floom-legacy-reactive`, so this crate
# needs no widget layer. See `docs/porting-floem-ui-to-2.0.md`.
floom-core-theme = { workspace = true }
floom-legacy-reactive = { path = "../../../../floom-legacy-reactive" }

[features]
material = ["floom-core-theme/material"]
cupertino = ["floom-core-theme/cupertino"]
fluent = ["floom-core-theme/fluent"]
