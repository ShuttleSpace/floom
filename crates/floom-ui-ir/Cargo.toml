[package]
name = "floom-ui-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned, serializable UI intermediate representation for Floom 2.0 tooling"

[dependencies]
# L0 vocabulary only: `Color` is the runtime colour type the IR's serializable
# `Rgba` bridges to. Like `floom-codegen`, this crate stays runtime-free so the
# IR can be parsed by tooling that never links a window.
floom-types = { path = "../floom-types", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
