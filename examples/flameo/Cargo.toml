[package]
name = "flameo"
version = "0.1.0"
edition = "2024"

[dependencies]
floom = { path = "../../crates/floom" }
floom-elements = { path = "../../crates/ecosystem/floom-ui/crates/floom-elements", features = ["material"] }
floom-core-theme = { path = "../../crates/ecosystem/floom-ui/crates/floom-core-theme" }

[dev-dependencies]
floom_testing = { path = "../../crates/ecosystem/floom-ui/crates/floom-testing" }

# `floom` is consumed as a direct path dependency rather than an upstream git
# dependency + `[patch]`. It used to be declared against `lapce/floem` on git and
# redirected here so the graph would hold a single `floem` whose types unify
# with the in-monorepo `floom-elements` / `floom-core-theme`. Pointing straight at
# the path gives the same single-instance graph without depending on a remote
# that has not been renamed yet.

# `floom` reaches `lapce/winit` through git, and a nested workspace does not
# inherit the monorepo root's `[patch]` — so pin the vendored tree here too,
# exactly as `../../Cargo.toml` does. Without this, `floem-winit` would be
# fetched from git and `floem-winit-core` / `dpi` would exist twice.
[patch."https://github.com/lapce/winit"]
floem-winit = { path = "../../crates/vendor/floem-winit/winit" }
floem-winit-core = { path = "../../crates/vendor/floem-winit/winit-core" }
dpi = { path = "../../crates/vendor/floem-winit/dpi" }
