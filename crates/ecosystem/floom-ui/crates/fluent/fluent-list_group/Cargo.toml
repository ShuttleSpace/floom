[package]
name = "floom-widget-fluent-list_group"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md).
floom-core-theme = { workspace = true }
floom-signal = { path = "../../../../../core/floom-signal" }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
# The engine's Accordion moved up a layer with the composites; the kit adapts its
# tokens to that, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }
# The chevron comes from this design system's own icon table.
floom-widget-fluent-icon = { workspace = true }

[dev-dependencies]
floom-core-theme = { workspace = true, features = ["fluent"] }
floom-types = { path = "../../../../../core/floom-types" }
