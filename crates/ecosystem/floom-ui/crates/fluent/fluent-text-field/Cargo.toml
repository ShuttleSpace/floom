[package]
name = "floom-widget-fluent-text-field"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md).
#
# `features = ["fluent"]`. All three design-system features are the *same* gate --
# `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]`
# -- so enabling the wrong one compiles just as well, which is how a generated
# manifest once said `["material"]` in a Cupertino crate and still built. These
# features are presence flags, not data selectors. It is not cosmetic here
# either: it is what turns on `floom-core-theme`'s own gated API, which
# the kit's tests need in order to pin a design system per thread.

floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["fluent"] }
# The theme binding is still an `RwSignal<MultiTheme>`, exactly as in the radio
# and slider ports, so `floom-signal` is still needed even though the v1 value and
# focus signals are gone: what went is the widget's state, not the kit's theme.
floom-signal = { path = "../../../../../core/floom-signal" }
# The engine's colour type, which `floom-ui-composites`' `TextFieldStyle` speaks.
floom-types = { path = "../../../../../core/floom-types" }
# The engine's `TextField` lives a layer up, in the composite crate; this kit
# adapts its tokens to that rather than to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core = { path = "../../../../../core/floom-core" }
# The paint assertions read back a recorded scene, which needs the testkit the
# engine ships.
floom-widgets = { path = "../../../../../widgets/floom-widgets" }
floom-types = { path = "../../../../../core/floom-types" }
floom-core-theme = { workspace = true }
