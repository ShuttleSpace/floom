[package]
name = "floom-widget-md-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see docs/porting-floem-ui-to-2.0.md). The
# theme signal comes from floom-widget-runtime, which is already ported.
#
# `features = ["material"]`. All three design-system features are the *same* gate
# -- `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]` --
# so enabling the wrong one compiles just as well. These are presence flags, not
# data selectors: nothing but reading the manifest catches a kit asking for the
# wrong one.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["material"] }
floom-signal = { path = "../../../../../floom-signal" }
floom-core = { path = "../../../../../floom-core" }
floom-types = { path = "../../../../../floom-types" }
floom-widgets = { path = "../../../../../floom-widgets" }
# The engine's Dialog moved up a layer with the composites; the overlay adapts
# its scrim-and-content card to that, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core-theme = { workspace = true }
floom-types = { path = "../../../../../floom-types" }
