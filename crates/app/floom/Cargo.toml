[package]
name = "floom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Floom 2.0 public facade: the beginner-facing prelude and feature bundles"

# Phase 29.3 — feature bundles.
#
# The default build is the headless core: no windowing backend, no GPU
# renderer, no tooling. Bundles are the beginner-facing spelling of "what a
# real app needs"; each one only adds `optional = true` dependencies, so
# `unused backends are not linked` is enforced structurally (and tested by
# `tests/feature_graph.rs`).
#
# Platform bundles: desktop / mobile / web / embedded. Only `desktop` is
# buildable on this machine (macOS + winit); the others exist so a
# target-appropriate build is one `--features` away.
#
# Capability bundles: `renderer-gpu` (vello + wgpu), `renderer-software`
# (tiny-skia), `devtools` (the L8 inspector/devtools tier — reachable from the
# facade because the facade sits at L9, above the tooling it re-exports).
#
# `native` needs no bundle: native view composition is part of the `floom-app`
# shell itself (Phase 16), not an optional backend.
[features]
default = []
desktop = ["dep:floom-platform-desktop", "floom-platform-desktop/winit"]
mobile = [
    "dep:floom-platform-android",
    "floom-platform/ios",
    "floom-platform/harmony",
]
web = ["dep:floom-platform-web", "dep:floom-renderer-web"]
embedded = [
    "dep:floom-platform-embedded",
    "dep:floom-renderer-software",
    "floom-platform/embedded",
]
# Terminal (character-grid) backend: the L4 platform + renderer that turn a
# terminal into a live Floom window. Off by default so a default build stays
# headless; `--features tui` adds exactly these two crates.
tui = ["dep:floom-platform-tui", "dep:floom-renderer-tui"]
renderer-gpu = ["dep:floom-renderer-vello", "floom-renderer-vello/gpu"]
renderer-software = ["dep:floom-renderer-software"]
devtools = ["dep:floom-devtools", "dep:floom-hot-reload"]

[dependencies]
floom-app = { path = "../floom-app", version = "0.2.0" }
floom-core = { path = "../../core/floom-core", version = "0.2.0" }
# Only the motion *vocabulary* is taken from here (the kind space and the
# tween builder); the scheduler itself stays behind `floom-app`. It is a new
# edge for the facade but not a new crate in the graph — `floom-app` already
# depends on it, so the headless floor `floom-hello` measures is unchanged.
floom-animation = { path = "../../system/floom-animation", version = "0.2.0" }
floom-layout = { path = "../../core/floom-layout", version = "0.2.0" }
# The reactive surface (`floom::reactive`): signals, scopes and their traits.
# A facade edge but no new crate in the graph — `floom-widgets` and
# `floom-runtime-core` already depend on it.
floom-signal = { path = "../../core/floom-signal", version = "0.2.0" }
# Re-exported whole (`floom::floom_scene`): the retained scene is the IR an
# app inspects when it asserts on what it drew, and `floom-app` already
# depends on it, so the headless graph gains no new crate.
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
# The neutral L4 contract (`Platform`, `WindowConfig`, `PlatformEvent`). The
# facade needs `WindowConfig` to describe a window for whichever backend the
# `run_*` entries drive, so this is a plain dependency, not a per-backend one.
floom-platform = { path = "../../platform/floom-platform", version = "0.2.0" }
floom-widgets = { path = "../../widgets/floom-widgets", version = "0.2.0" }
floom-platform-desktop = { path = "../../platform/floom-platform-desktop", version = "0.2.0", optional = true }
floom-platform-android = { path = "../../platform/floom-platform-android", version = "0.2.0", optional = true }
floom-platform-web = { path = "../../platform/floom-platform-web", version = "0.2.0", optional = true }
floom-renderer-web = { path = "../../render/floom-renderer-web", version = "0.2.0", optional = true }
floom-platform-tui = { path = "../../platform/floom-platform-tui", version = "0.2.0", optional = true }
floom-renderer-tui = { path = "../../render/floom-renderer-tui", version = "0.2.0", optional = true }
floom-platform-embedded = { path = "../../platform/floom-platform-embedded", version = "0.2.0", optional = true }
floom-renderer-vello = { path = "../../render/floom-renderer-vello", version = "0.2.0", optional = true }
floom-renderer-software = { path = "../../render/floom-renderer-software", version = "0.2.0", optional = true }
floom-devtools = { path = "../../devtools/floom-devtools", version = "0.2.0", optional = true }
# `floom::devtools::attach_elements` describes the host's own nodes into
# a live tree, which is what the inspector reads. Optional with the
# devtools bundle, which is the only feature that needs it.
floom-hot-reload = { path = "../../devtools/floom-hot-reload", version = "0.2.0", optional = true }
