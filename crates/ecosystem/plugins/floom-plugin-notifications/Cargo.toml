[package]
name = "floom-plugin-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: the device's notification authorisation"
rust-version.workspace = true
publish = false

# A plugin owns a *capability* and the host owns the *transport*. It depends
# on the platform layer and on nothing above it: no widget stack, no renderer,
# no facade. An app that wants this capability adds this crate; an app that
# does not, does not link it.
[dependencies]

# The JNI bridge — the JavaVM, the activity — is platform
# plumbing, so it lives in the platform layer and a plugin reaches
# for it. A plugin reaching *down* to the platform is the allowed
# direction; the platform reaching up to a plugin is not.
[target.'cfg(target_os = "android")'.dependencies]
floom-platform-mobile = { path = "../../../floom-platform-mobile", version = "0.2.0" }
jni = "0.22"

# The Apple arm reads `UNUserNotificationCenter` through objc2 and links
# UserNotifications for the class lookup. iOS and macOS share it: the framework
# is the same, and the macOS arm differs only in refusing an unbundled process.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# `getNotificationSettingsWithCompletionHandler:` answers through a block on a
# system queue, and the synchronous API waits for it. `block2` builds the block;
# `dispatch2` supplies the semaphore with the bounded wait.
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
] }
