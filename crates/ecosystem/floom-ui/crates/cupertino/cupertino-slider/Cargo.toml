[package]
name = "floom-widget-cupertino-slider"
version = "0.1.0"
edition = "2021"

[dependencies]
floom-core-theme = { workspace = true }
# The engine's colour type, which `floom-ui-composites`' `SliderStyle` speaks.
floom-types = { path = "../../../../../floom-types" }
floom-signal = { path = "../../../../../floom-signal" }
# The engine's `Slider` moved up a layer; this kit adapts its tokens to the
# composite, not to the widget crate it left.
floom-ui-composites = { path = "../../floom-ui-composites" }

[dev-dependencies]
floom-core = { path = "../../../../../floom-core" }
# The paint assertions read back a recorded scene, which needs the testkit the
# engine ships.
floom-widgets = { path = "../../../../../floom-widgets" }
floom-types = { path = "../../../../../floom-types" }
floom-core-theme = { workspace = true }
