[package]
name = "floom-plugin-prefs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: the OS's own key-value store for user preferences (SharedPreferences / NSUserDefaults / a config file)"
rust-version.workspace = true
publish = false

# A capability plugin: one capability, one crate, opt-in by dependency. It
# depends on the platform layer and on nothing above it.
[dependencies]

# `SharedPreferences` is a Java API, so the Android arm goes through the JNI
# bridge the platform layer owns. Writes use `commit()` (synchronous), not
# `apply()` — see the arm's docs.
[target.'cfg(target_os = "android")'.dependencies]
floom-platform-mobile = { path = "../../../platform/floom-platform-mobile", version = "0.2.0" }
jni = "0.22"

# iOS and macOS answer through `NSUserDefaults` — Foundation, the same object
# graph on both, so one arm serves both targets.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }

# Linux and Windows have no OS preferences store, so the arm is file-backed in
# the user's config directory — the same shape Flutter's own
# shared_preferences_linux/_windows implementations chose. `dirs` is already
# in the lock via `floom-plugin-paths`.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
dirs = "6"

[build-dependencies]
cc = "1"
