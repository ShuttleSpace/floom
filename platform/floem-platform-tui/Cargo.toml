[package]
name = "floem-platform-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal (character-grid) platform backend for Floem 2.0"
rust-version.workspace = true

[dependencies]
floem-platform = { path = "../floem-platform" }
floem-types = { path = "../../foundation/floem-types" }

# Terminal size detection on unix needs an ioctl; libc provides TIOCGWINSZ.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Example + fixture only; these are dev-dependencies so the L4 platform crate
# never ships a dependency on the L7 app crate (which would be a forbidden
# upward edge).
[dev-dependencies]
floem-app = { path = "../../app/floem-app" }
floem-renderer-tui = { path = "../../render/floem-renderer-tui" }
floem-widgets = { path = "../../widgets/floem-widgets" }
floem-layout = { path = "../../layout/floem-layout" }
