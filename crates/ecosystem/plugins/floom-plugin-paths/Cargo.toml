[package]
name = "floom-plugin-paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: where this app may write (app support, documents, cache, downloads, external storage)"
rust-version.workspace = true
publish = false

# A capability plugin: one capability, one crate, opt-in by dependency. It
# depends on the platform layer and on nothing above it.
[dependencies]

# `Context.getFilesDir` & friends are Java APIs, so the Android arm goes through
# the JNI bridge the platform layer owns. The plugin reaches down to the
# platform; the platform never reaches up.
[target.'cfg(target_os = "android")'.dependencies]
floom-platform-mobile = { path = "../../../platform/floom-platform-mobile", version = "0.2.0" }
jni = "0.22"

# iOS and macOS answer through `NSSearchPathForDirectoriesInDomains`, which is
# Foundation — the same object graph on both, so both targets share one arm and
# one dependency, like `package-info`'s `apple.rs`.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }

# The desktop arm is a *real* read, not a host-inert stub: the XDG / known-folder
# conventions are the source of truth on Linux, macOS and Windows, and `dirs` is
# the maintained crate for exactly that. Depending on it only where the arm
# exists keeps Android builds from carrying the dependency.
[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
dirs = "6"
