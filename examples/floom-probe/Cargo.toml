[package]
name = "floom-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Device-verification probe: in one window, every control the on-screen cases need"

# The real-window stack pulls in winit and wgpu. Everything is optional so the
# default workspace build (and CI) stays dependency-light; `--features real`
# activates the full desktop stack.
[features]
default = []
real = [
    "dep:floom-platform-desktop",
    "dep:floom-renderer-vello",
    "floom-platform-desktop/winit",
    "floom-renderer-vello/gpu",
]

[dependencies]
floom-animation = { workspace = true }
floom-app = { workspace = true }
floom-core = { workspace = true }
floom-layout = { workspace = true }
floom-platform = { workspace = true }
floom-types = { workspace = true }
floom-widgets = { workspace = true }
# The composite controls the on-screen cases drive — `Dialog`, `Popup`,
# `Select`, `BottomSheet`, `NavigationDrawer`, `NavDestination` — are not
# engine primitives. They live one layer above `floom-widgets`, in the
# `floom-ui` workspace, because a primitive has no way to take a design
# system's answer and these each hard-code one. `floom-widgets` cannot re-export
# them: the kits depend on `floom-widgets`, so the edge would close the loop.
#
# This is a path dependency across the two workspaces, the same shape
# `examples/floom-demo` uses for the design systems themselves.
floom-ui-composites = { workspace = true }
floom-platform-desktop = { workspace = true, optional = true }
floom-renderer-vello = { workspace = true, optional = true }

[[bin]]
name = "floom-probe"
path = "src/main.rs"
required-features = ["real"]
