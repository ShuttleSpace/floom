[package]
name = "floom-renderer-software"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Software/CPU Scene renderer adapter for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-renderer = { workspace = true }
floom-scene = { workspace = true }
floom-text = { workspace = true }
floom-types = { workspace = true }
# CPU glyph rasterisation for the software text path (same engine vger and
# tiny-skia use on their cache misses).
swash.workspace = true
peniko.workspace = true

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "self_draw"
harness = false
