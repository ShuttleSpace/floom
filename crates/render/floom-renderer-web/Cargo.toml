[package]
name = "floom-renderer-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web/WASM canvas presenter for Floom 2.0 (CPU scene rasterizer + canvas blit)"

[dependencies]
floom-renderer = { workspace = true }
floom-renderer-software = { workspace = true }
floom-scene = { workspace = true }
floom-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
] }

[dev-dependencies]
# The tests drive `WebPresenter` directly and inspect its CPU buffer, which is
# the presenter's real output on a non-wasm target: the blit is a no-op there,
# so everything worth asserting is observable without a browser.
floom-scene = { workspace = true }
floom-types = { workspace = true }
# `floom-renderer` is also the dev-dependency that carries the golden-file
# comparison, so the web can have a pixel golden through a dependency it
# already has rather than reaching up into the tooling layer. The comparison
# against the software reference catches a divergence between the two; the
# golden catches a change that moves both.
floom-renderer = { workspace = true }
