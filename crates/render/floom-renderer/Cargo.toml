[package]
name = "floom-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer ABI for Floom 2.0 (backend-neutral)"
rust-version.workspace = true

# This is the 2.0 renderer ABI crate, `floom-renderer` (imported as
# `floom_renderer`). The v1 renderer now lives under `crates/floom-renderer` as
# `floom-legacy-renderer` (imported as `floom_legacy_renderer`), so the two no
# longer collide on an import name.

[dependencies]
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
# Handle descriptors only — the ABI never names a windowing or GPU library.
raw-window-handle = { workspace = true }

[dev-dependencies]
# The capability query is checked against the backends that answer it
# differently: the software rasteriser and the character grid.
floom-renderer-software = { path = "../floom-renderer-software", version = "0.2.0" }
floom-renderer-tui = { path = "../floom-renderer-tui", version = "0.2.0" }
# The unified degradation report is checked against the backends whose
# conversions are non-trivial: vello's (a field-for-field copy) and the skia
# recorder's (its own counters, nothing invented).
floom-renderer-vello = { path = "../floom-renderer-vello", version = "0.2.0", features = ["gpu"] }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
