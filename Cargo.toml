# --- OHOS: retarget tgui-winit-ohos onto floem-winit-core ---
# `tgui-winit-ohos` 0.4.11 depends on upstream `winit-core` 0.31.0-beta.2, whose
# `ApplicationHandler` is a *different* trait from the one floem's `Application`
# implements (floem-winit-core). The two don't unify, so floem's
# `export_ohos_winit_app!(floem_app_factory)` cannot compile until both sides
# share one `ApplicationHandler` definition. This patch points the published
# crate at a local fork that renames `winit_core -> floem_winit_core` (pure
# crate rename, zero logic change — see platform-compat/tgui-winit-ohos/patch/README.md).
# The fork's `floem-winit-core` git rev matches floem's `floem-winit` git rev
# exactly, so the trait is byte-identical.
[patch.crates-io]
tgui-winit-ohos = { path = "platform-compat/tgui-winit-ohos" }

# --- iOS: fork floem-winit to forward shared files/URLs (floem #109) ---
# lapce/winit @ 133268de owns the `WinitApplicationDelegate` and used to drop
# both cold-start (`application:didFinishLaunchingWithOptions:`) and warm-start
# (`application:openURL:options:`) shares. This local fork (built from the
# published `floem-winit 0.29.5`, which is that exact rev) adds a
# `set_on_open_url` C callback that floem registers at startup; the delegate
# forwards every shared `NSURL` through it. No `[patch]` drift risk — same rev,
# same version (25.10.0). The fork's root `Cargo.toml` is a virtual workspace,
# so the patch must point at the `floem-winit` member package (`winit/`), not
# the workspace root. See docs/ios.md "Step 8b".
[patch."https://github.com/lapce/winit"]
floem-winit = { path = "platform-compat/floem-winit/winit" }
