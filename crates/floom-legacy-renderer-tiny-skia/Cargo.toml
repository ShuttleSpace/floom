[package]
name = "floom-legacy-renderer-tiny-skia"
version.workspace = true
edition.workspace = true
repository = "https://github.com/lapce/floom"
description = "A native Rust UI library with fine-grained reactivity"
license.workspace = true

[dependencies]
peniko = { workspace = true }
resvg = { workspace = true }
raw-window-handle = { workspace = true }
parley = { workspace = true }
swash = { workspace = true }
rustc-hash.workspace = true

anyhow = "1.0"
floom-legacy-renderer = { path = "../floom-legacy-renderer", version = "0.2.0" }
softbuffer = "0.4.1"

# Presenting the CPU-rasterized pixels on OHOS goes through a wgpu GLES
# surface blit (softbuffer has no OHOS backend).
[target.'cfg(target_env = "ohos")'.dependencies]
wgpu = { workspace = true }
