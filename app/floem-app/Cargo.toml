[package]
name = "floem-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless app shell that hosts a Floem 2.0 widget tree"
rust-version.workspace = true

[dependencies]
floem-core = { path = "../../foundation/floem-core", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
floem-accessibility = { path = "../../framework/floem-accessibility", version = "0.2.0" }
floem-layout = { path = "../../layout/floem-layout", version = "0.2.0" }
floem-runtime-core = { path = "../../runtime/floem-runtime-core", version = "0.2.0" }
floem-runtime = { path = "../../runtime/floem-runtime", version = "0.2.0" }
floem-focus = { path = "../../framework/floem-focus", version = "0.2.0" }
floem-overlay = { path = "../../framework/floem-overlay", version = "0.2.0" }
# The same scheduler the overlay stack drives its entry animation with: a
# frozen participant is animated by reusing it, not by adding a second clock.
floem-animation = { path = "../../framework/floem-animation", version = "0.2.0" }
floem-services = { path = "../../framework/floem-services", version = "0.2.0" }
floem-error = { path = "../../framework/floem-error", version = "0.2.0" }
floem-widgets = { path = "../../widgets/floem-widgets", version = "0.2.0" }
floem-text = { path = "../../text/floem-text", version = "0.2.0" }
# Participant ABI: the app hosts native views, so it is where the controller
# lives. The OS bridges themselves stay in the platform crates.
floem-native = { path = "../../native/floem-native", version = "0.2.0" }
# The wiring layer: the app is the top of the layering, so it is the one crate
# allowed to name both the platform ABI and the renderer ABI.
floem-platform = { path = "../../platform/floem-platform", version = "0.2.0" }
floem-renderer = { path = "../../render/floem-renderer", version = "0.2.0" }
# Image decoding for `register_image_decoded`: PNG + JPEG decode the formats
# UI layers actually load; more formats can be opted into via features.
image = { workspace = true, features = ["png", "jpeg"] }
smallvec = "1.15"

[dev-dependencies]
floem-legacy-reactive = { path = "../../legacy/floem-reactive", version = "0.2.0" }
floem-forms = { path = "../../framework/floem-forms", version = "0.2.0" }
floem-renderer-software = { path = "../../render/floem-renderer-software", version = "0.2.0" }
floem-renderer-tui = { path = "../../render/floem-renderer-tui", version = "0.2.0" }
floem-platform-tui = { path = "../../platform/floem-platform-tui", version = "0.2.0" }
floem-text = { path = "../../text/floem-text", version = "0.2.0" }
# The integration suites drive the app through the shared harness rather than
# each growing their own copy of it.
floem-testkit = { path = "../../tooling/floem-testkit", version = "0.2.0" }
