[package]
name = "floom-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless app shell that hosts a Floom 2.0 widget tree"
rust-version.workspace = true

[dependencies]
floom-core = { path = "../floom-core", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }
floom-scene = { path = "../floom-scene", version = "0.2.0" }
floom-accessibility = { path = "../floom-accessibility", version = "0.2.0" }
floom-layout = { path = "../floom-layout", version = "0.2.0" }
floom-runtime-core = { path = "../floom-runtime-core", version = "0.2.0" }
floom-focus = { path = "../floom-focus", version = "0.2.0" }
floom-overlay = { path = "../floom-overlay", version = "0.2.0" }
# The same scheduler the overlay stack drives its entry animation with: a
# frozen participant is animated by reusing it, not by adding a second clock.
floom-animation = { path = "../floom-animation", version = "0.2.0" }
floom-services = { path = "../floom-services", version = "0.2.0" }
floom-error = { path = "../floom-error", version = "0.2.0" }
floom-widgets = { path = "../floom-widgets", version = "0.2.0" }
floom-text = { path = "../floom-text", version = "0.2.0" }
# Participant ABI: the app hosts native views, so it is where the controller
# lives. The OS bridges themselves stay in the platform crates.
floom-native = { path = "../floom-native", version = "0.2.0" }
# The wiring layer: the app is the top of the layering, so it is the one crate
# allowed to name both the platform ABI and the renderer ABI.
floom-platform = { path = "../floom-platform", version = "0.2.0" }
floom-renderer = { path = "../floom-renderer", version = "0.2.0" }
# Image decoding for `register_image_decoded`: PNG + JPEG decode the formats
# UI layers actually load; more formats can be opted into via features.
image = { workspace = true, features = ["png", "jpeg"] }
smallvec = "1.15"

[dev-dependencies]
floom-signal = { path = "../floom-signal", version = "0.2.0" }
floom-forms = { path = "../floom-forms", version = "0.2.0" }
floom-renderer-software = { path = "../floom-renderer-software", version = "0.2.0" }
floom-renderer-tui = { path = "../floom-renderer-tui", version = "0.2.0" }
floom-platform-tui = { path = "../floom-platform-tui", version = "0.2.0" }
floom-text = { path = "../floom-text", version = "0.2.0" }
# The integration suites drive the app through the shared harness rather than
# each growing their own copy of it.
floom-testkit = { path = "../floom-testkit", version = "0.2.0" }
# The hosted-tree suite checks the host's data against the live tree it
# describes into. Dev-only: the app itself never depends on the tooling.
floom-hot-reload = { path = "../floom-hot-reload", version = "0.2.0" }
