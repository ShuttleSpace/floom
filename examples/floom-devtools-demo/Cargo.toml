[package]
name = "floom-devtools-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Floom 2.0 devtools panel in a real window: one line in, F12 to open, Ctrl+Shift+C to pick"

# The demo needs the facade's devtools bundle on top of a desktop window and a
# GPU presenter — the three features `run_desktop_with_devtools` documents.
[dependencies]
floom = { path = "../../crates/floom", version = "0.2.0", features = [
    "desktop",
    "renderer-gpu",
    "devtools",
] }
