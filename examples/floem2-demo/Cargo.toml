[package]
name = "floem2-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Floem 2.0 demo app: one crate, one gallery, one command per platform"

# One crate, one gallery: the same tree is mounted headless in CI, into a real
# winit window on the desktop, and inside a `native-activity` shared library on
# Android. The platform features are the *only* thing that varies, so
# `scripts/build.sh floem2-demo <platform>` has a single crate to point at.
#
# `headless` is the default so `cargo run -p floem2-demo` works with no flags
# (the golden-example harness runs exactly that); a platform build adds its own
# feature on top, and `src/main.rs` picks the real backend when present.

# Android's `native-activity` loads a shared library named by the manifest's
# `android.app.lib_name` (`floem2_demo`), so the entry point must live in a
# `cdylib` — a bin-only crate makes `cargo ndk` copy nothing into `jniLibs/`.
[lib]
name = "floem2_demo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["headless"]

# Pump a `WidgetHost` by hand and assert each demo mounted and painted. No
# windowing, no GPU — this is the mode `scripts/run-golden-examples.sh` runs.
headless = []

# Real window + GPU (winit + vello over wgpu). Verified on macOS.
macos = [
    "dep:floem-platform-desktop",
    "dep:floem-renderer-vello",
    "floem-platform-desktop/winit",
    "floem-renderer-vello/gpu",
]

# Real Android app: `native-activity` + vello GPU in one APK.
android = [
    "dep:floem-platform-android",
    "dep:floem-platform-mobile",
    "dep:floem-renderer-vello",
    "floem-renderer-vello/gpu",
]

# The v2 backends for these targets are still in-memory skeletons (see
# docs/2.0/EXAMPLES.md): the features exist so a target-appropriate `cargo
# check` has something to turn on, and nothing is reported as an artifact.
ios = ["dep:floem-platform-ios"]
ohos = ["dep:floem-platform-harmony"]
web = ["dep:floem-platform-web"]

[dependencies]
floem-app = { path = "../../app/floem-app", version = "0.2.0" }
floem-core = { path = "../../foundation/floem-core", version = "0.2.0" }
floem-layout = { path = "../../layout/floem-layout", version = "0.2.0" }
floem-platform = { path = "../../platform/floem-platform", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
floem-widgets = { path = "../../widgets/floem-widgets", version = "0.2.0" }

# The sections the gallery's richer demos come from: the virtualized data
# widgets, the forms controller, and the four design-system token tables.
floem-widgets-data = { path = "../../widgets/floem-widgets-data", version = "0.2.0" }
floem-forms = { path = "../../framework/floem-forms", version = "0.2.0" }
floem-material = { path = "../../design-systems/floem-material", version = "0.2.0" }
floem-cupertino = { path = "../../design-systems/floem-cupertino", version = "0.2.0" }
floem-fluent = { path = "../../design-systems/floem-fluent", version = "0.2.0" }
floem-harmony = { path = "../../design-systems/floem-harmony", version = "0.2.0" }

floem-platform-desktop = { path = "../../platform/floem-platform-desktop", version = "0.2.0", optional = true }
floem-platform-android = { path = "../../platform/floem-platform-android", version = "0.2.0", optional = true }
floem-platform-mobile = { path = "../../platform/floem-platform-mobile", version = "0.2.0", optional = true }
floem-platform-ios = { path = "../../platform/floem-platform-ios", version = "0.2.0", optional = true }
floem-platform-harmony = { path = "../../platform/floem-platform-harmony", version = "0.2.0", optional = true }
floem-platform-web = { path = "../../platform/floem-platform-web", version = "0.2.0", optional = true }
floem-renderer-vello = { path = "../../render/floem-renderer-vello", version = "0.2.0", optional = true }

# On Android the winit fork must be the same one Floem uses, so the
# `AndroidApp` type lines up with `floem_platform_android::set_android_app`.
[target.'cfg(target_os = "android")'.dependencies]
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit", features = ["android-native-activity"] }

# `src/main.rs` mounts into a window (with `macos`) or pumps the host headless;
# it is skipped entirely when there is no runnable backend for the feature set.
[[bin]]
name = "floem2-demo"
path = "src/main.rs"
required-features = ["headless"]
