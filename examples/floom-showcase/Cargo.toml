[package]
name = "floom-showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "One application over the engine, signals, the ported kits, and the editor"

[dependencies]
floom = { workspace = true, features = ["desktop", "renderer-gpu", "devtools"] }
floom-widgets = { workspace = true }
floom-signal = { workspace = true }
# The merged satellite crate, not the old root crate (Task 6 will retarget the
# workspace dependency itself).
floom-editor = { path = "../../crates/ecosystem/floom-editor/floom-editor" }

# Only the ported kits are imported. `crates/ecosystem/floom-ui` is a satellite
# workspace; the Material kit now ships every component behind a per-component
# feature, so this demo turns on just the three it shows. See `src/main.rs`.
floom-material = { workspace = true, features = ["text", "button", "checkbox"] }
floom-core-theme = { workspace = true, features = ["material"] }

[dev-dependencies]
floom-testkit = { workspace = true }
