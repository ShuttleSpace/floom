[package]
name = "floem-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless inspector for Floem 2.0: element-tree navigation, style/layout inspection, source mapping, semantics viewer and the why-did-this-update report (Phase 23.2)"

[dependencies]
# The inspector reads the retained tree the reload crate owns, and serves the
# wire format the protocol defines.
floem-hot-reload = { path = "../../compiler/floem-hot-reload", version = "0.2.0" }
floem-ui-ir = { path = "../../compiler/floem-ui-ir", version = "0.2.0" }
floem-inspector = { path = "../floem-inspector", version = "0.2.0" }
floem-runtime-core = { path = "../../runtime/floem-runtime-core", version = "0.2.0" }
floem-core = { path = "../../foundation/floem-core", version = "0.2.0" }
floem-style = { path = "../../layout/floem-style", version = "0.2.0" }
floem-accessibility = { path = "../../framework/floem-accessibility", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }

[dev-dependencies]
# Tests author documents in the DSL.
floem-dsl = { path = "../../compiler/floem-dsl", version = "0.2.0" }
floem-legacy-reactive = { path = "../../legacy/floem-reactive", version = "0.2.0" }
