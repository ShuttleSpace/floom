[package]
name = "floom-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained element runtime primitives for Floom 2.0"
rust-version.workspace = true

[dependencies]
bitflags = "2.9"
smallvec = "1.15"
floom-types = { path = "../floom-types", version = "0.2.0" }
floom-core = { path = "../floom-core", version = "0.2.0" }
floom-signal = { path = "../floom-signal", version = "0.2.0" }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "element_arena"
harness = false
