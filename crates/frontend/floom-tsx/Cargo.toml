[package]
name = "floom-tsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TSX front end for Floom: compile-time lowering of TSX into the UI IR"

[dependencies]
floom-dsl = { path = "../floom-dsl" }
serde_json = { workspace = true }

# Build-time only: the TSX parser never ships in the application binary.
#
# swc releases each crate independently, so version numbers do NOT line up:
# `swc_ecma_parser` pins its own `swc_ecma_ast`/`swc_common` companion. We must
# match that companion exactly or the `Span`/`Comments`/`StringInput` types
# collide (multiple `swc_common` copies in the tree). `swc_ecma_parser` 43.0.0
# is the version whose `swc_ecma_ast` dependency is `^27.0.0`, so we pin the
# trio below to keep a single, consistent toolchain.
swc_ecma_parser = "=43.0.0"
swc_ecma_ast = "=27.0.0"
swc_common = "=24.0.0"

[dev-dependencies]
serde_json = { workspace = true }
