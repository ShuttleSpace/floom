[package]
name = "floom-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless inspector for Floom 2.0: element-tree navigation, style/layout inspection, source mapping, semantics viewer and the why-did-this-update report"

[dependencies]
# The inspector reads the retained tree the reload crate owns, and serves the
# wire format the protocol defines.
floom-hot-reload = { path = "../floom-hot-reload", version = "0.2.0" }
floom-ui-ir = { path = "../floom-ui-ir", version = "0.2.0" }
floom-inspector = { path = "../floom-inspector", version = "0.2.0" }
# The console readout lists what the error boundary caught.
floom-error = { path = "../floom-error", version = "0.2.0" }
floom-runtime-core = { path = "../floom-runtime-core", version = "0.2.0" }
floom-core = { path = "../floom-core", version = "0.2.0" }
floom-style = { path = "../floom-style", version = "0.2.0" }
floom-accessibility = { path = "../floom-accessibility", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }
# The panel is a widget: it draws itself with the engine's primitives
# rather than asking the host for a second window.
floom-widgets = { path = "../floom-widgets", version = "0.2.0" }

[dev-dependencies]
# Tests author documents in the DSL.
floom-dsl = { path = "../floom-dsl", version = "0.2.0" }
floom-signal = { path = "../floom-signal", version = "0.2.0" }
