[package]
name = "floom-platform-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded / DRM-framebuffer platform adapter for Floom 2.0"
rust-version.workspace = true

[features]
default = []
# Real DRM/KMS backend is feature-gated; default path is headless framebuffer sim.
drm = []

[dependencies]
floom-accessibility = { path = "../floom-accessibility", version = "0.2.0" }
floom-platform = { path = "../floom-platform", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }
