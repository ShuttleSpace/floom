[package]
name = "floem2-android-example"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# `native-activity` loads a *shared library* named by the manifest's
# `android.app.lib_name` meta-data (`floem2_android_example`). A bin-only crate
# produces an executable and `cargo ndk` would copy nothing into `jniLibs/`,
# so the Android entry point must live in a `cdylib` lib target.
[lib]
name = "floem2_android_example"
path = "src/lib.rs"
crate-type = ["cdylib"]

# The GPU presenter (`VelloGpuPresenter`) is feature-gated so the host build and
# `cargo test --workspace` stay dependency-light; `--features real` activates the
# full Android stack (wgpu + vello). The APK build script / cross-check must pass
# `--features real`.
[features]
default = []
real = ["floem-renderer-vello/gpu"]

[dependencies]
floem-app = { path = "../../app/floem-app" }
floem-core = { path = "../../foundation/floem-core" }
floem-layout = { path = "../../layout/floem-layout" }
floem-platform = { path = "../../platform/floem-platform" }
floem-platform-android = { path = "../../platform/floem-platform-android" }
floem-renderer-vello = { path = "../../render/floem-renderer-vello", optional = true }
floem-types = { path = "../../foundation/floem-types" }
floem-widgets = { path = "../../widgets/floem-widgets" }

# On Android we need the *same* winit fork Floem uses so the `AndroidApp`
# type lines up with `floem_platform_android::set_android_app`. The rev must
# match the one pinned in Floem's root `Cargo.toml` (`winit` workspace dep).
[target.'cfg(target_os = "android")'.dependencies]
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit", features = ["android-native-activity"] }
