[package]
name = "floom-plugin-package-info"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Floom plugin: the running app's own identity (name, bundle id, version, build)"
rust-version.workspace = true
publish = false

# A capability plugin: one capability, one crate, opt-in by dependency. It
# depends on the platform layer and on nothing above it.
[dependencies]

# `PackageManager` / `Context.getPackageName` are Java APIs, so the Android arm
# goes through the JNI bridge the platform layer owns. The plugin reaches down
# to the platform; the platform never reaches up.
[target.'cfg(target_os = "android")'.dependencies]
floom-platform-mobile = { path = "../../../floom-platform-mobile", version = "0.2.0" }
jni = "0.22"

# iOS and macOS answer from `NSBundle.mainBundle`, which is Foundation — the
# same object graph on both, so both targets share one arm and one dependency.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
