[package]
name = "floom-core-theme"
license = "MIT"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith. This crate is theme tokens, so it needs no
# widget layer at all -- only the reactive primitives it stores theme state in
# (`RwSignal`, `create_global_rw_signal`) and the two value types it converts
# to (`peniko::Color`, `parley::style::FontWeight`). See
# `../floem-archive/docs/porting-floem-ui-to-2.0.md`.
floom-signal = { workspace = true }
# The engine's colour type, for the boundary conversion.
floom-types = { workspace = true }
peniko = "0.6"
parley = "0.7"

[features]
material = []
cupertino = []
fluent = []
