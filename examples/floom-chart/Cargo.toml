[package]
name = "floom-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Self-drawn content: a line chart on a Canvas, clipped to its plot area"

# The software renderer is enabled *by the example*, not by the facade: the
# example's assertions render real pixels through it, and a facade consumer
# that never draws pays nothing for that.
[dependencies]
floom = { path = "../../crates/floom", version = "0.2.0", features = [
    "renderer-software",
] }
floom-renderer = { path = "../../crates/floom-renderer", version = "0.2.0" }
# The chart's data is a reactive signal read by the painter closure; the
# canvas needs it Send + Sync, hence the sync flavour.
floom-signal = { path = "../../crates/floom-signal", version = "0.2.0" }
