[package]
name = "floom-widget-cupertino-card"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 `floom` monolith (see ../floem-archive/docs/porting-floem-ui-to-2.0.md).
# The theme signal comes from floom-widget-runtime, which is already ported.
#
# `features = ["cupertino"]`. All three design-system features are the *same* gate
# -- `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]`
# -- so enabling the wrong one compiles just as well, which is how fluent-card's
# first manifest said `["material"]` and still built. See the correction in
# ../floem-archive/docs/porting-floem-ui-to-2.0.md: these features are presence flags, not data
# selectors, so nothing but reading the manifest can catch a kit asking for the
# wrong design system.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["cupertino"] }
floom-signal = { path = "../../../../../core/floom-signal" }
floom-core = { path = "../../../../../core/floom-core" }
floom-types = { path = "../../../../../core/floom-types" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }

[dev-dependencies]
floom-core-theme = { workspace = true }
floom-types = { path = "../../../../../core/floom-types" }
