[package]
name = "floem2-style"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Gradients, real elevation, and an implicit hover fade armed with a design-system motion token"

# The software renderer is enabled *by the example*, not by the facade: acts 1
# and 2 assert rendered pixels, and a facade consumer that never draws pays
# nothing for that.
[dependencies]
floem2 = { path = "../../crates/floom2", version = "0.2.0", features = [
    "renderer-software",
] }
floem-renderer = { path = "../../crates/floom-renderer", version = "0.2.0" }
# Act 4 arms a button with the Material motion tokens themselves: the design
# system decides the timing, and nothing below restates it.
floem-material = { path = "../../crates/floom-material", version = "0.2.0" }
