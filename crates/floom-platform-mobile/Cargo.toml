[package]
name = "floem-platform-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mobile OS-capability packages for Floem 2.0 (iOS/Android): camera, location, sensors, vibration and more, following the mod.rs + ios/android dispatch pattern."
rust-version.workspace = true

[dependencies]
floem-types = { path = "../floom-types", version = "0.2.0" }

# ── iOS ──────────────────────────────────────────────────────────────────────
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8"
block2 = "0.6"

# ── Android ──────────────────────────────────────────────────────────────────
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

# Each capability (camera, location, …) is exposed behind a feature flag in a
# real app so the shipped binary only links the backends it uses. `vibration`
# is on by default to keep the worked example wired for CI builds.
[features]
default = ["vibration"]
vibration = []
