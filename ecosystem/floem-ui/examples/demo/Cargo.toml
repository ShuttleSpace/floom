[package]
name = "floem-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
floem = { workspace = true }
floem-core-theme = { workspace = true }
floem-elements = { workspace = true }
floem-widget-runtime = { workspace = true }

[features]
default = ["multi"]
material = ["floem-elements/material", "floem-widget-runtime/material"]
cupertino = ["floem-elements/cupertino", "floem-widget-runtime/cupertino"]
fluent = ["floem-elements/fluent", "floem-widget-runtime/fluent"]
multi = ["floem-elements/multi", "floem-widget-runtime/material"]
