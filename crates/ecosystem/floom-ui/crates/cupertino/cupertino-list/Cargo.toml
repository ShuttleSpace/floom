[package]
name = "floom-widget-cupertino-list"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ported off the v1 monolith (see ../floem-archive/docs/porting-floem-ui-to-2.0.md). The theme
# signal comes from floom-widget-runtime, which is already ported.
#
# `features = ["cupertino"]`. All three design-system features are the *same* gate
# -- `#[cfg(any(feature = "material", feature = "cupertino", feature = "fluent"))]`
# -- so enabling the wrong one compiles just as well. These are presence flags,
# not data selectors: nothing but reading the manifest catches a kit asking for
# the wrong one.
floom-core-theme = { workspace = true }
floom-widget-runtime = { workspace = true, features = ["cupertino"] }
# The theme binding, which is `RwSignal<MultiTheme>` exactly as in the other
# ported kits.
floom-signal = { path = "../../../../../core/floom-signal" }
# The engine's colour type, which `ListStyle` speaks.
floom-types = { path = "../../../../../core/floom-types" }
# The engine's row component and the container the kit composes it in. The
# engine's own `List<T>` is deliberately not used: it is a diff mechanism with
# an empty `paint`, and a list kit wants a styled row.
floom-ui-composites = { path = "../../floom-ui-composites" }
# The engine's layout vocabulary (`Axis`, `LayoutRequest`, `Stack`, `Container`,
# `Spacer`) is part of the public `view()` output, not just tests.
floom-core = { path = "../../../../../core/floom-core" }
floom-widgets = { path = "../../../../../widgets/floom-widgets" }

[dev-dependencies]
# The paint assertions read back a recorded scene, which needs the testkit the
# engine ships.
floom-core-theme = { workspace = true }
