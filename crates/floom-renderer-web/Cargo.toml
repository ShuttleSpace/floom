[package]
name = "floom-renderer-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web/WASM canvas presenter for Floom 2.0 (CPU scene rasterizer + canvas blit)"

[dependencies]
floom-renderer = { path = "../floom-renderer", version = "0.2.0" }
# The pixel golden: the web's own buffer, hashed and compared against a file.
# The comparison against the software reference catches a divergence between
# the two; the golden catches a change that moves both.
floom-snapshot = { path = "../floom-snapshot", version = "0.2.0" }
floom-renderer-software = { path = "../floom-renderer-software", version = "0.2.0" }
floom-scene = { path = "../floom-scene", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
] }

[dev-dependencies]
# The tests drive `WebPresenter` directly and inspect its CPU buffer, which is
# the presenter's real output on a non-wasm target: the blit is a no-op there,
# so everything worth asserting is observable without a browser.
floom-scene = { path = "../floom-scene", version = "0.2.0" }
floom-types = { path = "../floom-types", version = "0.2.0" }
floom-renderer = { path = "../floom-renderer", version = "0.2.0" }
# The pixel golden: the web's own buffer, hashed and compared against a file.
# The comparison against the software reference catches a divergence between
# the two; the golden catches a change that moves both.
floom-snapshot = { path = "../floom-snapshot", version = "0.2.0" }
