on:
  push:
    branches:
      - main
      - floom-2.0
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

name: CI core

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # One unified workspace: core/ system/ frontend/ widgets/ native/ platform/
  # render/ devtools/ app/. Every check below names those packages explicitly --
  # see FLOOM2_PACKAGES -- so the job neither depends on the workspace default
  # members nor pulls in the nested vendor/ and ecosystem/ workspaces.
  floom-2-0:
    name: Floom 2.0 on ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Every core-workspace crate, as one shell word each, so all three cargo
      # steps below receive the whole set without naming it again. Grouped by the
      # layer directory the crate lives in. Adding a crate means adding it here
      # and nowhere else. Examples (`examples/*`) are excluded: they are built by
      # the `build` job.
      #
      # Spelled `--package=NAME` rather than the shorter `-p NAME` on purpose:
      # cargo-fmt takes `--package` as a variadic option and folds a following
      # space-separated list into a single package spec, so with the short form
      # "cargo fmt -p a -p b" looks up a package literally named " a -p b" and
      # only ever works for one crate. The `=` form keeps each package one argv
      # entry for cargo, cargo-fmt and the doc-test pass alike.
      #
      # The list is expanded unquoted, i.e. by shell word splitting -- bash is
      # what GitHub runs `run:` with on both macOS and Ubuntu. Quoting it would
      # pass the entire list as a single package argument.
      FLOOM2_PACKAGES: >-
        --package=floom-types --package=floom-core --package=floom-signal --package=floom-style --package=floom-layout --package=floom-scene --package=floom-runtime-core --package=floom-accessibility
        --package=floom-accuracy --package=floom-animation
        --package=floom-dsl --package=floom-tsx
        --package=floom-text --package=floom-virtual --package=floom-widgets --package=floom-widgets-data
        --package=floom-native --package=floom-native-ffi
        --package=floom-platform --package=floom-platform-desktop --package=floom-platform-android --package=floom-platform-tui --package=floom-platform-web --package=floom-ui-events-winit
        --package=floom-platform-harmony --package=floom-platform-ios --package=floom-platform-embedded
        --package=floom-renderer --package=floom-renderer-software --package=floom-renderer-vello --package=floom-renderer-tui --package=floom-renderer-web
        --package=floom-devtools --package=floom-hot-reload --package=floom-inspector --package=floom-snapshot --package=floom-testkit
        --package=floom-app --package=floom-cli --package=floom
    steps:
      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get -y update
          # fontconfig is what `yeslogic-fontconfig-sys` panics without, and the
          # 2.0 set includes `floom-text`, which pulls it in through parley.
          sudo apt-get -y install clang libwayland-dev libxkbcommon-x11-dev pkg-config libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libfontconfig1-dev

      - name: Free disk space on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update toolchain & add rustfmt
        run: |
          rustup update --no-self-update
          rustup component add rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: floom-2.0
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Fetch dependencies
        run: cargo fetch

      # Scoped rather than the repo-wide `--all` the fmt job runs: the core
      # tree is kept rustfmt-clean on its own, so a formatting question about
      # the ecosystem/plugin workspaces cannot red this signal (and vice versa).
      - name: Check formatting
        run: cargo fmt $FLOOM2_PACKAGES --check

      - name: Run tests
        run: cargo test $FLOOM2_PACKAGES --no-fail-fast

      - name: Run doc tests
        run: cargo test $FLOOM2_PACKAGES --doc --no-fail-fast

      # Everything above runs the facade with *no* backend compiled: default
      # features are empty on purpose. The real macOS backend (`desktop`, i.e.
      # winit + AppKit + the GPU presenter) is a separate bundle, and this is the
      # only place where its wiring is executed rather than merely compiled.
      - name: Test the desktop bundle on macOS
        if: runner.os == 'macOS'
        run: cargo test -p floom --features desktop --no-fail-fast

      - name: Check architecture dependency boundaries
        run: ./scripts/check-architecture-deps.sh

      # Structural, so it needs no toolchain: a module is a `src/name.rs`, and
      # a `mod.rs` creeping back is the one thing the compiler cannot object to.
      - name: Check module paths
        run: ./scripts/check-module-paths.sh

      # The native-view plugin's native half is Objective-C and reaches AppKit,
      # so the window half of its verification only runs on macOS. The
      # framework-side half -- the C ABI, the provider, the lifecycle -- is
      # covered by the test suite on every platform.
      - name: Run the native-view example
        if: matrix.os == 'macos-latest'
        # `--self-check` exits once the chain is proved; without it the example
        # keeps its window up for a human, and the job waits forever.
        run: >
          cargo run
          --manifest-path crates/ecosystem/plugins/Cargo.toml
          -p floom-plugin-webview --example native_view -- --self-check

  build:
    name: Rust on ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get -y update
          sudo apt-get -y install clang libwayland-dev libxkbcommon-x11-dev pkg-config libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev

      - name: Update toolchain
        run: |
          rustup update --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      # `--workspace` builds this crate with its default features, and the
      # clipboard lives behind `winit` because that is its only caller. Without
      # this step the Linux and Windows arms would only ever be type-checked by
      # the all-features MSRV job.
      - name: Test the session clipboard
        if: runner.os != 'macOS'
        run: cargo test -p floom-platform-desktop --features winit --no-fail-fast -- --nocapture

      - name: Run doc tests
        # Only run doctests on macOS to improve CI times - macOS is currently the fastest runner
        if: startsWith(matrix.os, 'macos')
        run: cargo test --doc --no-fail-fast

  bundles:
    name: Floom bundles on ubuntu-24.04
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space on Ubuntu
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get -y install clang libwayland-dev libxkbcommon-x11-dev \
            pkg-config libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libfontconfig1-dev
      - name: Update toolchain
        run: rustup update --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bundles
      - name: Fetch dependencies
        run: cargo fetch
      # The 3-OS job runs the facade with no backend compiled (default features
      # are empty). That leaves every bundle's *runtime* wiring — which platform
      # wins the cascade, what the backend reports about its capabilities, what
      # `run` does when the surface cannot be created — covered by nothing but
      # `cargo check --all-features` in the MSRV job. These runs execute it.
      - name: Test every bundle that can run headless
        run: |
          set -e
          for bundle in desktop tui full; do
            echo "::group::cargo test -p floom --features $bundle"
            cargo test -p floom --features "$bundle" --no-fail-fast
            echo "::endgroup::"
          done

  gpu-pixels:
    # The pixel tests are the only evidence that a clip, a shadow or a filter
    # actually puts ink where it claims to. They need a real adapter, so the
    # 3-OS job skips them; this runner has Metal. If it ever stops having one the
    # tests fail with the module's own "no GPU adapter ... this is a skip, not a
    # pass" message instead of a green run that drew nothing.
    name: GPU pixels on macos-latest
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update toolchain
        run: rustup update --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gpu-pixels
      - name: Fetch dependencies
        run: cargo fetch
      - name: Run the pixel tests
        run: cargo test -p floom-renderer-vello --features gpu -- --ignored --test-threads=1

  architecture-deps:
    name: Architecture dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update toolchain
        run: rustup update --no-self-update

      - name: Check architecture dependency boundaries
        run: ./scripts/check-architecture-deps.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update toolchain & add rustfmt
        run: |
          rustup update
          rustup component add rustfmt

      - name: Run rustfmt
        # Every workspace, not just the root. `crates/ecosystem/floom-ui` and
        # `crates/ecosystem/floom-editor` have their own Cargo.toml, and root
        # `cargo fmt --all` reaches neither -- the same boundary that let the
        # editor's committed sources sit unformatted while this job was green.
        #
        # `status` rather than a bare loop: GitHub's default shell runs under
        # `set -e`, so an unformatted `floom-ui` would end the step and hide
        # whatever `floom-editor` had to say. The gate accumulates for the same
        # reason.
        run: |
          status=0
          cargo fmt --all --check || status=1
          for manifest in crates/ecosystem/*/Cargo.toml; do
            grep -qx '\[workspace\]' "$manifest" || continue
            (cd "$(dirname "$manifest")" && cargo fmt --all --check) || status=1
          done
          exit "$status"

  clippy:
    name: Clippy on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free disk space on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update toolchain & add clippy
        run: |
          rustup update --no-self-update
          rustup component add clippy

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get -y update
          sudo apt-get -y install clang libwayland-dev libxkbcommon-x11-dev pkg-config libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Fetch dependencies
        run: cargo fetch

      - name: Run clippy
        run: cargo clippy -- --deny warnings

  # Scans tracked files for known misspellings. Config lives in `.typos.toml`;
  # the vendored upstream trees are excluded there -- their code is not ours to
  # re-spell.
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for typos
        uses: crate-ci/typos@v1

  # License, advisory and duplicate-dependency policy for the root workspace's
  # dependency graph, config in `deny.toml`. Advisories run separately from the
  # rest so a new CVE cannot suppress a ban violation (or vice versa): each
  # matrix entry fails on its own.
  cargo-deny:
    name: Cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check dependency policies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # The dev toolchain is pinned by `rust-toolchain.toml` and deliberately not the
  # crate MSRV (`rust-version` in `Cargo.toml`) -- every other job here compiles
  # with that pin, so nothing else proves the code still builds at the declared
  # MSRV. This job reads the declaration and checks at exactly that version,
  # rather than a second hardcoded copy that would drift out of sync.
  msrv:
    name: MSRV
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on Ubuntu
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies on Ubuntu
        run: |
          sudo apt-get -y update
          sudo apt-get -y install clang libwayland-dev libxkbcommon-x11-dev pkg-config libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev

      - name: Update toolchain
        run: rustup update --no-self-update

      - name: Read the declared MSRV
        run: |
          msrv="$(awk -F'"' '/^rust-version = /{print $2; exit}' Cargo.toml)"
          echo "MSRV_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "${MSRV_TOOLCHAIN:?}" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Fetch dependencies
        run: rustup run "$MSRV_TOOLCHAIN" cargo fetch

      - name: Check at the declared MSRV
        # `rustup run` selects the declared toolchain over the
        # `rust-toolchain.toml` pin. Whole workspace, examples included;
        # `--all-features` because feature-gated code is where MSRV breakage
        # hides.
        run: rustup run "$MSRV_TOOLCHAIN" cargo check --workspace --all-features

  # G11 with teeth: the size budgets were a local check because the numbers are
  # host-specific. This runner has its own baseline, so the comparison is
  # Linux-against-Linux and the gate can fail a build that grows a tier.
  size-budgets:
    name: Size budgets on ubuntu-24.04
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: size-budgets
      - name: Install what the release builds link
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libgtk-3-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Measure each tier (baseline harvest — temporary)
        run: |
          FLOOM_SIZE_BASELINE="$RUNNER_TEMP/size.json" bash scripts/check-size-budgets.sh --update
          cat "$RUNNER_TEMP/size.json"
