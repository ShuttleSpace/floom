[package]
name = "floem-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless test harness that drives a Floem 2.0 app the way a window would"
rust-version.workspace = true

[dependencies]
floem-app = { path = "../../app/floem-app", version = "0.2.0" }
floem-core = { path = "../../foundation/floem-core", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
floem-layout = { path = "../../layout/floem-layout", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
# A harness has to own the same two edges the app shell does: it delivers the
# platform ABI in and reads the scene out. That is the whole point of it, and it
# is why this crate sits *above* the app rather than beside the framework
# crates — nothing in the framework may depend on it.
floem-platform = { path = "../../platform/floem-platform", version = "0.2.0" }
floem-renderer-software = { path = "../../render/floem-renderer-software", version = "0.2.0" }

[dev-dependencies]
floem-widgets = { path = "../../widgets/floem-widgets", version = "0.2.0" }
