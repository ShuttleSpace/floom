[package]
name = "floem2-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Floem 2.0 macOS gate probe: real window, text field, system clipboard, feature-gated"

# The desktop counterpart of `floem2-android`: it exists to produce the evidence
# `docs/gates/macos.md` records — a tree an external driver can click, a text
# field an input method can type into, and a clipboard whose far end is the
# system pasteboard. `floem2-window` covers "the stack runs in a window"; this
# covers "the OS-facing services actually reach it".
#
# Everything real (winit + wgpu) is optional so the default workspace build and
# CI stay dependency-light; `--features real` activates the desktop stack, and
# the bin declares it required so nothing tries to build a window without it.
[features]
default = []
real = [
    "dep:floem-platform-desktop",
    "dep:floem-renderer-vello",
    "floem-platform-desktop/winit",
    "floem-renderer-vello/gpu",
]

[dependencies]
floem-app = { path = "../../crates/floom-app", version = "0.2.0" }
floem-core = { path = "../../crates/floom-core", version = "0.2.0" }
floem-layout = { path = "../../crates/floom-layout", version = "0.2.0" }
floem-platform = { path = "../../crates/floom-platform", version = "0.2.0" }
floem-platform-desktop = { path = "../../crates/floom-platform-desktop", version = "0.2.0", optional = true }
floem-renderer-vello = { path = "../../crates/floom-renderer-vello", version = "0.2.0", optional = true }
floem-types = { path = "../../crates/floom-types", version = "0.2.0" }
floem-widgets = { path = "../../crates/floom-widgets", version = "0.2.0" }

[[bin]]
name = "floem2-macos"
path = "src/main.rs"
required-features = ["real"]
