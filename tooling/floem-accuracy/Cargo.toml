[package]
name = "floem-accuracy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AI/design accuracy loop: a reference screen gallery, a render-and-compare evaluation harness, and an agent repair benchmark (Phase 27)"

[dependencies]
# The gallery screens are real widget trees, not mock-ups: the loop is only
# worth automating if what it measures is what a user would see.
floem-widgets = { path = "../../widgets/floem-widgets", version = "0.2.0" }
floem-testkit = { path = "../floem-testkit", version = "0.2.0" }
# Pixels, scenes and semantics come from the snapshot engine, so an evaluation
# fingerprint is the same one `assert_snapshot` would pin.
floem-snapshot = { path = "../floem-snapshot", version = "0.2.0" }
# Inspection goes through the agent protocol (Phase 25) and the design
# contract (Phase 26) — the loop closes over vocabulary that already exists.
floem-agent = { path = "../floem-agent", version = "0.2.0" }
floem-ui-ir = { path = "../../compiler/floem-ui-ir", version = "0.2.0" }
floem-design = { path = "../../design-systems/floem-design", version = "0.2.0" }
# Scene nodes are read directly out of the retained graph for geometry and
# colour probes.
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
# The `Labeled` box the screens use declares its role in the a11y vocabulary.
floem-accessibility = { path = "../../framework/floem-accessibility", version = "0.2.0" }
# The screen builder sizes cards from the text engine's own measurements, so
# the layout adapts to whatever font metrics the host resolves.
floem-text = { path = "../../text/floem-text", version = "0.2.0" }
floem-core = { path = "../../foundation/floem-core", version = "0.2.0" }
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
