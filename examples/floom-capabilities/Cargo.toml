[package]
name = "floom-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Floom 2.0 platform-capability showcase: the same tree on every platform, reporting what the OS actually returned"

# One crate, one capability gallery, one command per platform — the same shape
# as `floom-demo`, but the subject is the *platform surface* rather than the
# widget vocabulary.
#
# The point of this example is honesty about reach. Every capability row calls
# the real `floom-platform-mobile` API and shows what came back, including
# "unavailable on this platform" where the host arm is inert. A gallery that
# printed "OK" everywhere would be worth less than none: on a desktop host every
# one of the 12 readings genuinely cannot work, and the example should say so in
# the same typeface as the ones that can.
#
# `headless` is the default so the golden-example harness can run it with no
# windowing, exactly like `floom-demo`.

[lib]
name = "floom_capabilities"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["headless"]

# Pump the `WidgetHost` by hand and print every capability's answer. No window,
# no GPU — this is the mode CI and the golden harness run.
headless = []

# A real window: winit + vello over wgpu.
macos = [
    "dep:floom-platform-desktop",
    "dep:floom-renderer-vello",
    "floom-platform-desktop/winit",
    "floom-renderer-vello/gpu",
]

# A real APK: `native-activity` + vello GPU. The capability packages are the
# whole point here — they are real JNI on this target.
android = [
    "dep:floom-platform-android",
    "dep:floom-renderer-vello",
    "floom-renderer-vello/gpu",
]

# Turn the backend crate on so the gallery can be `cargo check`ed for the
# target. The v2 backends for these are still in-memory skeletons
# (see `docs/2.0/EXAMPLES.md`), so no artifact is claimed for them.
ios = ["dep:floom-platform-ios"]
web = ["dep:floom-platform-web"]

[dependencies]
floom-app = { path = "../../crates/floom-app", version = "0.2.0" }
floom-core = { path = "../../crates/floom-core", version = "0.2.0" }
floom-layout = { path = "../../crates/floom-layout", version = "0.2.0" }
floom-platform = { path = "../../crates/floom-platform", version = "0.2.0" }
# All 13 capability packages this example demonstrates. Same layer (L4) as the
# platform backends, so the architecture gate permits the edge.
floom-platform-mobile = { path = "../../crates/floom-platform-mobile", version = "0.2.0" }

# The capabilities this gallery demonstrates. Each is a plugin, so the gallery
# depends on the ones it shows and the SDK does not carry any of them.
floom-plugin-battery = { path = "../../crates/ecosystem/plugins/floom-plugin-battery", version = "0.2.0" }
floom-plugin-connectivity = { path = "../../crates/ecosystem/plugins/floom-plugin-connectivity", version = "0.2.0" }
floom-plugin-device-info = { path = "../../crates/ecosystem/plugins/floom-plugin-device-info", version = "0.2.0" }
floom-plugin-local-auth = { path = "../../crates/ecosystem/plugins/floom-plugin-local-auth", version = "0.2.0" }
floom-plugin-location = { path = "../../crates/ecosystem/plugins/floom-plugin-location", version = "0.2.0" }
floom-plugin-notifications = { path = "../../crates/ecosystem/plugins/floom-plugin-notifications", version = "0.2.0" }
floom-plugin-package-info = { path = "../../crates/ecosystem/plugins/floom-plugin-package-info", version = "0.2.0" }
floom-plugin-paths = { path = "../../crates/ecosystem/plugins/floom-plugin-paths", version = "0.2.0" }
floom-plugin-open-url = { path = "../../crates/ecosystem/plugins/floom-plugin-open-url", version = "0.2.0" }
floom-plugin-file-dialog = { path = "../../crates/ecosystem/plugins/floom-plugin-file-dialog", version = "0.2.0" }
floom-plugin-prefs = { path = "../../crates/ecosystem/plugins/floom-plugin-prefs", version = "0.2.0" }
floom-plugin-wakelock = { path = "../../crates/ecosystem/plugins/floom-plugin-wakelock", version = "0.2.0" }
floom-plugin-network-info = { path = "../../crates/ecosystem/plugins/floom-plugin-network-info", version = "0.2.0" }
floom-plugin-background-work = { path = "../../crates/ecosystem/plugins/floom-plugin-background-work", version = "0.2.0" }
floom-plugin-mdns = { path = "../../crates/ecosystem/plugins/floom-plugin-mdns", version = "0.2.0" }
floom-plugin-secure-storage = { path = "../../crates/ecosystem/plugins/floom-plugin-secure-storage", version = "0.2.0" }
floom-plugin-sensors = { path = "../../crates/ecosystem/plugins/floom-plugin-sensors", version = "0.2.0" }
floom-plugin-share = { path = "../../crates/ecosystem/plugins/floom-plugin-share", version = "0.2.0" }
floom-plugin-vibration = { path = "../../crates/ecosystem/plugins/floom-plugin-vibration", version = "0.2.0" }
floom-types = { path = "../../crates/floom-types", version = "0.2.0" }
floom-widgets = { path = "../../crates/floom-widgets", version = "0.2.0" }

floom-platform-desktop = { path = "../../crates/floom-platform-desktop", version = "0.2.0", optional = true }
floom-platform-android = { path = "../../crates/floom-platform-android", version = "0.2.0", optional = true }
floom-platform-ios = { path = "../../crates/floom-platform-ios", version = "0.2.0", optional = true }
floom-platform-web = { path = "../../crates/floom-platform-web", version = "0.2.0", optional = true }
floom-renderer-vello = { path = "../../crates/floom-renderer-vello", version = "0.2.0", optional = true }

# On Android the winit fork must be Floom's own, so the `AndroidApp` type lines
# up with `floom_platform_android::set_android_app`.
[target.'cfg(target_os = "android")'.dependencies]
winit = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", package = "floem-winit", features = ["android-native-activity"] }

[[bin]]
name = "floom-capabilities"
path = "src/main.rs"
required-features = ["headless"]
