[package]
name = "floom-renderer-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal (character-cell) Scene renderer and presenter for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-renderer = { workspace = true }
floom-scene = { workspace = true }
floom-types = { workspace = true }

[dev-dependencies]
floom-text = { workspace = true }
# The golden-file comparison comes from `floom-renderer` (already a
# dependency, so no new edge): the terminal's picture is a character grid,
# and the snapshot is that grid as text.
