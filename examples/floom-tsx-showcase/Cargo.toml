[package]
name = "floom-tsx-showcase"
license = "MIT"
version.workspace = true
edition.workspace = true
publish = false
description = "floom-tsx build-time TSX -> Rust GUI demo (Task 7)"

# The real-window stack (winit + vello GPU) is optional so the default build
# stays dependency-light and only proves the TSX -> emit -> compile path.
[features]
default = []
real = [
    "dep:floom-platform-desktop",
    "dep:floom-renderer-vello",
    "floom-platform-desktop/winit",
    "floom-renderer-vello/gpu",
]

[dependencies]
floom-app = { workspace = true }
floom-core = { workspace = true }
floom-layout = { workspace = true }
floom-platform = { workspace = true }
floom-types = { workspace = true }
# Referenced by the generated `ui_gen.rs`.
floom-widgets = { workspace = true }
# Only needed when the window actually runs.
floom-platform-desktop = { workspace = true, optional = true }
floom-renderer-vello = { workspace = true, optional = true }

[build-dependencies]
floom-tsx = { workspace = true }
floom-dsl = { workspace = true }

[dev-dependencies]
floom-testkit = { workspace = true }
floom-types = { workspace = true }
