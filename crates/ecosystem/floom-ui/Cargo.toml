[workspace]

# --- floom-ui satellite workspace ---------------------------------------
#
# Independent Cargo workspace (own Cargo.lock + justfile). The root manifest
# excludes crates/ecosystem, so root `cargo test --workspace` does NOT reach it;
# it runs via `just gate ecosystem` / CI `ecosystem-check` (cargo test
# --workspace here, all headless).
#
# Layout: engine floom-widgets (root) -> floom-ui-composites (cross-DS
# components) -> per-DS kit crates. All 9 members resolve; exclude = []
# (no excluded crates). There is no floom-elements facade (removed in Stage D);
# each design system is one kit crate (floom-material/cupertino/fluent) with a
# per-component feature over floom-ui-composites (default = [], full = all).
#
# See docs/PLAN.md for the current architecture and task list.

exclude = [
]
members = [
    "crates/floom-core-theme",
    "crates/floom-cupertino",
    "crates/floom-design",
    "crates/floom-fluent",
    "crates/floom-material",
    "crates/floom-testing",
    "crates/floom-theme",
    "crates/floom-ui-composites",
    "crates/floom-widget-runtime",
]

resolver = "2"


[workspace.package]
# Present because the six design-system crates that moved here from the root
# workspace declare `version.workspace = true` and friends. The values are the
# root's, so a crate reports the same version whichever workspace built it —
# which is the whole reason they can move at all.
license = "MIT"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/lapce/floom"

[workspace.dependencies]
floom-accessibility = { path = "../../core/floom-accessibility", version = "0.2.0" }
floom-app = { path = "../../app/floom-app" }
floom-core = { path = "../../core/floom-core" }
floom-design = { path = "crates/floom-design" }
floom-layout = { path = "../../core/floom-layout" }
floom-native = { path = "../../native/floom-native" }
floom-platform = { path = "../../platform/floom-platform" }
floom-renderer-software = { path = "../../render/floom-renderer-software" }
floom-scene = { path = "../../core/floom-scene", version = "0.2.0" }
floom-signal = { path = "../../core/floom-signal" }
floom-snapshot = { path = "../../devtools/floom-snapshot" }
floom-style = { path = "../../core/floom-style", version = "0.2.0" }
floom-testkit = { path = "../../devtools/floom-testkit" }
floom-text = { path = "../../widgets/floom-text" }
floom-theme = { path = "crates/floom-theme", version = "0.2.0" }
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
floom-ui-composites = { path = "crates/floom-ui-composites" }
floom-widgets = { path = "../../widgets/floom-widgets" }
floom-core-theme = { path = "crates/floom-core-theme" }
floom-widget-runtime = { path = "crates/floom-widget-runtime" }

# Stage D removed the `floom = { path = "../../app/floom" }` entry above and every
# `floom = { workspace = true }` in this workspace's member manifests. Nothing here
# links the v1 monolith any more; the `floom-elements` re-export layer went with
# it, so each kit crate names `floom-core-theme` and `floom-widget-runtime`
# directly.

# `floom-app` reaches `lapce/winit` through git, and a nested workspace does not
# inherit the monorepo root's `[patch]` - so pin the vendored tree here too,
# exactly as `../../Cargo.toml` does. Without this, `floem-winit` would be
# fetched from git and `floem-winit-core` / `dpi` would exist twice.
[patch."https://github.com/lapce/winit"]
floem-winit = { path = "../../vendor/floem-winit/winit" }
floem-winit-core = { path = "../../vendor/floem-winit/winit-core" }
dpi = { path = "../../vendor/floem-winit/dpi" }
