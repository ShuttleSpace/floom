[package]
name = "floom-hot-reload"
description = "Hot-reload of widget, style and IR changes for Floom 2.0 applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floom-types = { workspace = true }
floom-core = { workspace = true }
floom-style = { workspace = true }
floom-runtime-core = { workspace = true }
# The reload protocol diffs two UI IR documents; the IR is folded into
# floom-dsl as its `ui_ir` module.
floom-dsl = { workspace = true }

[dev-dependencies]
# Test documents read better as DSL source than as struct literals.
floom-dsl = { workspace = true }
