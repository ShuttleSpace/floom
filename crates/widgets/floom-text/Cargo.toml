[package]
name = "floom-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-neutral text layout and shaping for Floom 2.0"
rust-version.workspace = true

[dependencies]
floom-types = { path = "../../core/floom-types", version = "0.2.0" }
peniko = { workspace = true }
parley = { workspace = true }
# The `scale` feature is what lets the editor layout measure a glyph's ink
# bounds, which is what makes a selection rectangle cover the glyphs it
# covers rather than their advances.
swash = { workspace = true, features = ["scale"] }
rustc-hash.workspace = true

# OHOS is `target_os = "linux"` but ships no fontconfig. `fontique`'s default
# `system` source (pulled by parley) would try to link fontconfig against a
# sysroot that has none. Enabling the `dlopen` source resolves it at runtime
# instead, so the cross build needs no fontconfig dev package or pkg-config.
# A target-specific dependency is the clean lever: no feature chains (cargo
# forbids `dep/dep2/feature`), no CLI flag, no env var, and it applies only to
# OHOS — the host and other targets keep the linked fontconfig path untouched.
[target.'cfg(target_env = "ohos")'.dependencies]
fontique = { workspace = true, features = ["fontconfig-dlopen"] }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "shaping"
harness = false
