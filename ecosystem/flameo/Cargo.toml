[package]
name = "flameo"
version = "0.1.0"
edition = "2024"

[dependencies]
floem = { git = "https://github.com/lapce/floem" }
floem-elements = { path = "../floem-ui/crates/floem-elements", features = ["material"] }
floem-core-theme = { path = "../floem-ui/crates/floem-core-theme" }

[dev-dependencies]
floem_testing = { path = "../floem-ui/crates/floem-testing" }

# `floem` itself is declared against upstream git, but `floem-elements` and
# `floem-core-theme` are the in-monorepo copies and resolve `floem` from this
# repository. Without the patch the graph would hold two `floem` crates and
# their types would not unify.
[patch."https://github.com/lapce/floem"]
floem = { path = "../.." }

# `floem` reaches `lapce/winit` through git, and a nested workspace does not
# inherit the monorepo root's `[patch]` — so pin the vendored tree here too,
# exactly as `../../Cargo.toml` does. Without this, `floem-winit` would be
# fetched from git and `floem-winit-core` / `dpi` would exist twice.
[patch."https://github.com/lapce/winit"]
floem-winit = { path = "../../vendor/floem-winit/winit" }
floem-winit-core = { path = "../../vendor/floem-winit/winit-core" }
dpi = { path = "../../vendor/floem-winit/dpi" }
