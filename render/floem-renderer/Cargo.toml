[package]
name = "floem-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer ABI for Floem 2.0 (backend-neutral)"
rust-version.workspace = true

# This is the 2.0 renderer ABI crate, `floem-renderer` (imported as
# `floem_renderer`). The v1 renderer now lives under `legacy/floem-renderer` as
# `floem-legacy-renderer` (imported as `floem_legacy_renderer`), so the two no
# longer collide on an import name.

[dependencies]
floem-types = { path = "../../foundation/floem-types", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
# Handle descriptors only — the ABI never names a windowing or GPU library.
raw-window-handle = { workspace = true }

[dev-dependencies]
