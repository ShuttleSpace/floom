[package]
name = "floem-renderer-vello"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vello Scene adapter for Floem 2.0 Renderer ABI (recording layer)"
rust-version.workspace = true

[dependencies]
floem-renderer = { path = "../floem-renderer", version = "0.2.0" }
floem-scene = { path = "../../scene/floem-scene", version = "0.2.0" }
floem-types = { path = "../../crates/floem-types", version = "0.2.0" }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "scene_render"
harness = false
